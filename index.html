/* ---------- native ZIP creator (no library) ---------- */
async function nativeZip(files){
  /* files: [{name:string, content:string}] */
  const encoder=new TextEncoder();
  const entries=[];
  let offset=0;
  for(const f of files){
    const data=encoder.encode(f.content||'');
    let compressed=data;
    let method=0; // 0=stored
    if(typeof CompressionStream!=='undefined'){
      try{
        const cs=new CompressionStream('deflate-raw');
        const w=cs.writable.getWriter();w.write(data);w.close();
        compressed=new Uint8Array(await new Response(cs.readable).arrayBuffer());
        method=8; // 8=deflated
      }catch(e){}
    }
    const nameBytes=encoder.encode(f.name);
    entries.push({nameBytes,data,compressed,method,crc:crc32(data),offset});
    offset+=30+nameBytes.length+compressed.length;
  }
  const cdOffset=offset;
  let cdSize=0;
  for(const e of entries){cdSize+=46+e.nameBytes.length;}
  const buf=new ArrayBuffer(cdOffset+cdSize+22);
  const v=new DataView(buf);const u8=new Uint8Array(buf);
  let pos=0;
  for(const e of entries){
    // local file header
    v.setUint32(pos,0x04034b50,true);pos+=4;
    v.setUint16(pos,20,true);pos+=2; // version needed
    v.setUint16(pos,0,true);pos+=2; // flags
    v.setUint16(pos,e.method,true);pos+=2; // compression
    v.setUint16(pos,0,true);pos+=2; // mod time
    v.setUint16(pos,0,true);pos+=2; // mod date
    v.setUint32(pos,e.crc,true);pos+=4;
    v.setUint32(pos,e.compressed.length,true);pos+=4; // compressed size
    v.setUint32(pos,e.data.length,true);pos+=4; // uncompressed size
    v.setUint16(pos,e.nameBytes.length,true);pos+=2;
    v.setUint16(pos,0,true);pos+=2; // extra field len
    u8.set(e.nameBytes,pos);pos+=e.nameBytes.length;
    u8.set(e.compressed,pos);pos+=e.compressed.length;
  }
  // central directory
  for(const e of entries){
    v.setUint32(pos,0x02014b50,true);pos+=4;
    v.setUint16(pos,20,true);pos+=2; // version made by
    v.setUint16(pos,20,true);pos+=2; // version needed
    v.setUint16(pos,0,true);pos+=2; // flags
    v.setUint16(pos,e.method,true);pos+=2;
    v.setUint16(pos,0,true);pos+=2; // mod time
    v.setUint16(pos,0,true);pos+=2; // mod date
    v.setUint32(pos,e.crc,true);pos+=4;
    v.setUint32(pos,e.compressed.length,true);pos+=4;
    v.setUint32(pos,e.data.length,true);pos+=4;
    v.setUint16(pos,e.nameBytes.length,true);pos+=2;
    v.setUint16(pos,0,true);pos+=2; // extra
    v.setUint16(pos,0,true);pos+=2; // comment
    v.setUint16(pos,0,true);pos+=2; // disk#
    v.setUint16(pos,0,true);pos+=2; // internal attr
    v.setUint32(pos,0,true);pos+=4; // external attr
    v.setUint32(pos,e.offset,true);pos+=4;
    u8.set(e.nameBytes,pos);pos+=e.nameBytes.length;
  }
  // end of central directory
  v.setUint32(pos,0x06054b50,true);pos+=4;
  v.setUint16(pos,0,true);pos+=2;
  v.setUint16(pos,0,true);pos+=2;
  v.setUint16(pos,entries.length,true);pos+=2;
  v.setUint16(pos,entries.length,true);pos+=2;
  v.setUint32(pos,cdSize,true);pos+=4;
  v.setUint32(pos,cdOffset,true);pos+=4;
  v.setUint16(pos,0,true);pos+=2;
  return new Blob([buf],{type:'application/zip'});
}
function crc32(data){let c=0xFFFFFFFF;const t=new Uint8Array(data);for(let i=0;i<t.length;i++){c^=t[i];for(let j=0;j<8;j++){c=(c>>>1)^(c&1?0xEDB88320:0);}}return(c^0xFFFFFFFF)>>>0;}

function collectFiles(nodes,base){
  const out=[];
  (nodes||[]).forEach(n=>{
    const p=base?(base+'/'+n.name):n.name;
    if(n.type==='folder'){if(n.children)out.push(...collectFiles(n.children,p));}
    else{out.push({name:p,content:n.content||''});}
  });
  return out;
}

async function exportZip(){
  if(!state.fileList.length)return toast('Nothing to export','info');
  const rootName=state.fileList[0]&&state.fileList[0].name||'project';
  let totalCount=0;
  (function cnt(ns){ns.forEach(function(n){if(n.type==='folder'&&n.children)cnt(n.children);else totalCount++;});})(state.fileList);
  const prog=showExportProgress('Exporting "'+rootName+'"',totalCount);
  const t0=performance.now();
  try{
    prog.logTask('Collecting file list...','active');
    const files=await collectFilesAsync(state.fileList,null,function(count){prog.update(Math.round(count/totalCount*10),'Collecting files: '+count.toLocaleString()+' / '+totalCount.toLocaleString());});
    if(prog.isCancelled()){prog.done();toast('Export cancelled','info');return;}
    prog.logTask('Collected '+files.length.toLocaleString()+' files ('+Math.round(performance.now()-t0)+'ms)','done');
    prog.update(10,'Compressing '+files.length.toLocaleString()+' files...');
    const blob=await nativeZipChunked(files,prog);
    if(prog.isCancelled()){prog.done();toast('Export cancelled','info');return;}
    prog.update(100,'Done!');
    const elapsed=((performance.now()-t0)/1000).toFixed(1);
    const sizeMB=(blob.size/(1024*1024)).toFixed(2);
    prog.showSummary([{label:'Files',value:files.length.toLocaleString()},{label:'ZIP Size',value:sizeMB+' MB'},{label:'Time',value:elapsed+'s'}]);
    prog.logTask('Download starting...','done');
    await new Promise(function(r){setTimeout(r,600);});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=rootName+'.zip';
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},5000);
    prog.done();
    toast('Exported ZIP ('+files.length.toLocaleString()+' files, '+sizeMB+' MB, '+elapsed+'s)','success',4000);
  }catch(e){
    if(e.message==='Cancelled'){prog.done();toast('Export cancelled','info');return;}
    prog.logTask('Error: '+e.message,'error');prog.done();
    toast('ZIP export failed: '+e.message,'error');
  }
}

function flattenProject(nodes,path){
  const out=[];
  (nodes||[]).forEach(n=>{
    const p=path?(path+'/'+n.name):n.name;
    if(n.type==='folder'){out.push({type:'folder',name:n.name,children:flattenProject(n.children,p)});}
    else{const o={type:'file',name:n.name,content:n.content||'',path:p};if(n.binary)o.binary=true;if(n.mime)o.mime=n.mime;out.push(o);}
  });
  return out;
}

const _IMPORT_CHUNK=100; // process 100 files per yield
const _LAZY_THRESHOLD=3000; // above this file count, skip content reading (structure-only import)
const _MAX_PROJECT_FILES=500000; // absolute hard limit for project file count

/* Show a progress modal, returns {update(pct,stats),done(),isCancelled()} */
let _importCancelFlag=false;

    +'<div class="btn-row"><button class="btn sm danger" onclick="_importCancelFlag=true">Cancel</button></div>'
    +'</div>');
  return {

    done(){closeModal();},
    isCancelled(){return _importCancelFlag;}

/* Yield to the event loop so the UI can repaint */
function yieldToUI(){return new Promise(r=>setTimeout(r,0));}

/* Read file entries with Map-based O(1) folder lookup and structure-only mode for large projects.
   Every file is imported — nothing is skipped. Returns {tree, failed, total, lazy} */
async function readFolderEntries(files, progress, rootName){
  const total=files.length;
  if(total>_MAX_PROJECT_FILES){
    progress.update(100,'Too many files ('+total.toLocaleString()+'). Limit is '+(_MAX_PROJECT_FILES/1000)+'K.');
    return {tree:{type:'folder',name:rootName,children:[]},failed:total,total,lazy:true};
  }
  const root={type:'folder',name:rootName,children:[]};
  const lazyMode=total>_LAZY_THRESHOLD;
  if(lazyMode)state.lazyImport=true;
  const folderMap=new Map();
  folderMap.set('',root.children);
  let read=0,failed=0;
  for(let i=0;i<total;i++){
    if(progress.isCancelled())break;
    const f=files[i];
    const parts=f.webkitRelativePath.split('/');
    parts.shift();
    let cur=root.children;
    const fp=[];
    for(let j=0;j<parts.length-1;j++){
      fp.push(parts[j]);
      const key=fp.join('/');
      let arr=folderMap.get(key);
      if(!arr){
        const d={type:'folder',name:parts[j],children:[]};
        cur.push(d);
        folderMap.set(key,d.children);
        arr=d.children;
      }
      cur=arr;
    }
    if(lazyMode){
      const fp=rootName+'/'+parts.join('/');
      cur.push({type:'file',name:parts[parts.length-1],content:''});
      _pendingFileRefs.set(fp,f);
    }else{
      try{
        const rd=await readFileSmart(f);
        const item={type:'file',name:parts[parts.length-1],content:rd.content};
        if(rd.binary){item.binary=true;item.mime=rd.mime;}
        cur.push(item);
      }
      catch(e){failed++;cur.push({type:'file',name:parts[parts.length-1],content:''});}
    }
    read++;
    if(read%200===0){
      progress.update(read/total*100,(lazyMode?'Scanning':'Reading')+' '+read.toLocaleString()+'/'+total.toLocaleString()+(failed?' ('+failed+' failed)':''));
      await yieldToUI();
    }
  }
  progress.update(100,'Done — '+read.toLocaleString()+' files'+(lazyMode?' scanned':' read')+(failed?', '+failed+' failed':''));
  return {tree:root,failed,total,lazy:lazyMode};
}

/* Build flat file list for JSON project format */
function treeToFlat(nodes,basePath){
  const out=[];
  (nodes||[]).forEach(n=>{
    const p=basePath?(basePath+'/'+n.name):n.name;
    if(n.type==='folder'){out.push({type:'folder',name:n.name,children:treeToFlat(n.children,p)});}
    else{const o={type:'file',name:n.name,content:n.content||'',path:p};if(n.binary)o.binary=true;if(n.mime)o.mime=n.mime;out.push(o);}
  });
  return out;
}

/* Generic: import loose files into a folder node */
async function importFilesIntoNode(files,parentId){
  const parent=findNode(state.fileList,parentId);
  if(!parent||parent.type!=='folder'){toast('Target folder not found','error');return;}
  const prog=showImportProgress('Importing '+files.length+' file'+(files.length>1?'s':'')+'...');
  let added=0,failed=0;
  for(let i=0;i<files.length;i++){
    if(prog.isCancelled())break;
    const f=files[i];
    try{
      const rd=await readFileSmart(f);
      const node=createFile(f.name,rd.content,null,parentId,true);
      if(node){added++;if(rd.binary){node.binary=true;node.mime=rd.mime;}}
    }catch(e){failed++;}
    prog.update((i+1)/files.length*100,'Processed '+(i+1)+'/'+files.length+(failed?' ('+failed+' failed)':''));
    if(i%_IMPORT_CHUNK===0)await yieldToUI();
  }
  state.projectDirty=true;
  renderExplorer();renderStatusbar();
  prog.done();
  toast('Imported '+added+' file'+(added!==1?'s':'')+(failed?', '+failed+' failed':''),'success');
}

/* Generic: import a folder tree into a folder node */
async function importFolderIntoNode(files,folderName,parentId){
  const parent=findNode(state.fileList,parentId);
  if(!parent||parent.type!=='folder'){toast('Target folder not found','error');return;}
  const prog=showImportProgress('Importing folder "'+folderName+'"...');
  const result=await readFolderEntries(files,prog,folderName);
  if(prog.isCancelled()){prog.done();toast('Import cancelled','info');return;}
  // Merge the imported tree into the parent
  const newNodes=buildNodeTree(treeToFlat(result.tree.children,folderName),folderName,result.total>_LAZY_THRESHOLD?false:true);
  const folderNode={id:uid(),name:folderName,type:'folder',isOpen:false,children:newNodes,path:parent.path?parent.path+'/'+folderName:folderName};
  if(!parent.children)parent.children=[];
  parent.children.push(folderNode);
  state.projectDirty=true;
  renderExplorer();renderStatusbar();
  prog.done();
  toast('Imported "'+folderName+'" ('+result.total+' files'+(result.failed?', '+result.failed+' failed':'')+')','success');
}

/* ---------- workspace persistence (auto-save / restore via localStorage) ---------- */
function treeToFlatSkipLazy(nodes,basePath){
  const out=[];
  (nodes||[]).forEach(n=>{
    const p=basePath?(basePath+'/'+n.name):n.name;
    if(n.type==='folder'){if(n.children)out.push({type:'folder',name:n.name,children:treeToFlatSkipLazy(n.children,p)});}
    else{
      // skip lazy placeholders whose real content hasn't been read yet
      if(n.path&&(_pendingFileRefs.has(n.path)||_pendingEntryRefs.has(n.path)))return;
      const o={type:'file',name:n.name,content:n.content||'',path:p};if(n.binary)o.binary=true;if(n.mime)o.mime=n.mime;out.push(o);
    }
  });
  return out;
}
function saveWorkspace(force){
  if(!state.fileList.length)return;
  if(!state.settings.autoSave&&!force)return;
  try{
    const root=state.fileList[0];
    state.openFiles.forEach(f=>{const n=findNode(state.fileList,f.id);if(n)n.content=f.content;});
    const snap={name:root.name,lazy:!!state.lazyImport,savedAt:Date.now(),
      files:treeToFlatSkipLazy(root.children,root.name),
      tabs:state.openFiles.map(f=>f.path||f.name),
      active:(currentOpen()&&(currentOpen().path||currentOpen().name))||''};
    const json=JSON.stringify(snap);
    if(json.length>4500000){LS.del('workspace');return;}
    localStorage.setItem('ban.workspace',json);
    state.projectDirty=false;
  }catch(e){}
}
function restoreWorkspace(){
  if(!state.settings.restoreSession)return false;
  const snap=LS.get('workspace',null);
  if(!snap||!snap.files||!snap.files.length)return false;
  if(snap.lazy)return false; // lazily-imported huge projects can't be restored without their file refs
  try{
    const name=snap.name||'workspace';
    let fl=snap.files;
    if(fl.length===1&&fl[0].type==='folder'&&fl[0].name===name)fl=fl[0].children||[];
    state.lazyImport=false;
    state.fileList=[{id:uid(),name:name,type:'folder',isOpen:true,children:buildNodeTree(fl,name,true),path:name}];
    state.projectJson={name:name,version:'1.0.0',files:snap.files};state.projectDirty=false;
    (snap.tabs||[]).forEach(p=>{const n=findNodeByRef(p,'file');if(n)openNode(n);});
    if(snap.active){const n=findNodeByRef(snap.active,'file');if(n){state.activeFileId=n.id;renderTabs();renderEditor();renderStatusbar();setDocName(n.name);}}
    return true;
  }catch(e){return false;}
}

async function collectFilesAsync(nodes,base,onProgress){
  var out=[];
  function dataUrlToBytes(s){
    if(typeof s!=='string'||!s.startsWith('data:'))return null;
    var comma=s.indexOf(',');
    if(comma<0)return null;
    var meta=s.slice(5,comma),body=s.slice(comma+1);
    try{
      if(/;base64/i.test(meta)){
        var bin=atob(body),bytes=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
        return bytes;
      }
      return new TextEncoder().encode(decodeURIComponent(body));
    }catch(e){return null;}
  }
  async function walk(ns,b){
    for(var i=0;i<ns.length;i++){
      var n=ns[i],p=b?(b+'/'+n.name):n.name;
      if(n.type==='folder'){
        if(n.children&&n.children.length)await walk(n.children,p);
        else out.push({name:p+'/',content:'',directory:true});
      }else{
        out.push({name:p,content:n.content||'',bytes:n.binary?dataUrlToBytes(n.content||''):null,binary:!!n.binary});
      }
      if(out.length%2000===0){onProgress(out.length);await yieldToUI();}
    }
  }
  await walk(nodes,base);
  return out;
}
async function nativeZipChunked(files,progress){
  /*
   * Reliable ZIP writer.
   * Use ZIP STORE (method 0) instead of CompressionStream('deflate-raw'):
   * raw-deflate support is inconsistent between browsers and can create
   * archives that download successfully but fail when extracted.
   */
  var encoder=new TextEncoder(),CHUNK=500,total=files.length,entries=[],offset=0;
  progress.logTask('Starting ZIP archive creation...','active');
  progress.logTask('Using ZIP STORE mode for maximum compatibility','');

  function getBytes(f){
    if(f.bytes instanceof Uint8Array)return f.bytes;
    if(f.bytes instanceof ArrayBuffer)return new Uint8Array(f.bytes);
    return encoder.encode(typeof f.content==='string'?f.content:String(f.content||''));
  }
  function dosDateTime(){
    var d=new Date(),year=Math.max(1980,d.getFullYear());
    return {
      time:((d.getHours()&31)<<11)|((d.getMinutes()&63)<<5)|Math.floor(d.getSeconds()/2),
      date:(((year-1980)&127)<<9)|(((d.getMonth()+1)&15)<<5)|(d.getDate()&31)
    };
  }
  var dt=dosDateTime();
  var useZip64=false; // set automatically when classic ZIP32 limits are exceeded

  function set64(v,pos,val){ // write a 64-bit unsigned little-endian value
    v.setUint32(pos,(val>>>0),true);
    v.setUint32(pos+4,((val/4294967296)>>>0),true);
  }

  /* Pass 1: build entries and compute each entry's byte offset.
     No hard limits anymore: sizes/offsets/counts over ZIP32 bounds simply flag ZIP64. */
  for(var c=0;c<total;c+=CHUNK){
    if(progress.isCancelled())throw new Error('Cancelled');
    var end=Math.min(c+CHUNK,total);
    for(var i=c;i<end;i++){
      var f=files[i],data=f.directory?new Uint8Array(0):getBytes(f);
      var name=String(f.name||'file').replace(/\\/g,'/');
      if(f.directory&&!name.endsWith('/'))name+='/';
      var nameBytes=encoder.encode(name);
      if(nameBytes.length>0xFFFF)throw new Error('File path is too long: '+name);
      // Local header needs the ZIP64 extra field only when the sizes overflow 32 bits.
      var localExtra=(data.length>0xFFFFFFFF)?20:0;
      if(data.length>0xFFFFFFFF)useZip64=true;
      entries.push({
        nameBytes:nameBytes,data:data,compressed:data,method:0,crc:crc32(data),
        offset:offset,directory:!!f.directory,time:dt.time,date:dt.date,
        localExtra:localExtra,bigSize:data.length>0xFFFFFFFF
      });
      offset+=30+nameBytes.length+localExtra+data.length;
      if(offset>0xFFFFFFFF)useZip64=true;
    }
    progress.update(Math.round(end/Math.max(total,1)*80),
      'Preparing ZIP '+end.toLocaleString()+' / '+total.toLocaleString()+' files...');
    progress.logTask('Prepared batch '+Math.ceil((c+1)/CHUNK)+' ('+end.toLocaleString()+' / '+total.toLocaleString()+')',
      c+CHUNK>=total?'done':'');
    await yieldToUI();
  }

  if(entries.length>0xFFFF)useZip64=true; // classic EOCD counts are 16-bit

  progress.update(85,'Assembling ZIP archive...');
  progress.logTask('Writing local file headers...','active');
  await yieldToUI();

  var cdOffset=offset,cdSize=0;
  for(var ei=0;ei<entries.length;ei++){
    var ee=entries[ei];
    // Central directory needs the ZIP64 extra field if sizes or the header offset overflow.
    ee.cdExtra=(ee.bigSize||ee.offset>0xFFFFFFFF)
      ?((ee.bigSize?16:0)+(ee.offset>0xFFFFFFFF?8:0)+4):0;
    cdSize+=46+ee.nameBytes.length+ee.cdExtra;
  }
  if(cdOffset>0xFFFFFFFF||cdSize>0xFFFFFFFF)useZip64=true;

  var tail=useZip64?(56+20+22):22; // zip64 EOCD + locator + standard EOCD, or just standard EOCD
  var buf=new ArrayBuffer(cdOffset+cdSize+tail),v=new DataView(buf),u8=new Uint8Array(buf),pos=0;
  var flags=0x0800; // UTF-8 filenames
  var ver=useZip64?45:20; // 45 == version needed for ZIP64 features

  var HEADER_CHUNK=1000;
  for(var c2=0;c2<entries.length;c2+=HEADER_CHUNK){
    var endH=Math.min(c2+HEADER_CHUNK,entries.length);
    for(var i2=c2;i2<endH;i2++){
      var e=entries[i2];
      v.setUint32(pos,0x04034b50,true);pos+=4;
      v.setUint16(pos,ver,true);pos+=2;
      v.setUint16(pos,flags,true);pos+=2;
      v.setUint16(pos,e.method,true);pos+=2;
      v.setUint16(pos,e.time,true);pos+=2;
      v.setUint16(pos,e.date,true);pos+=2;
      v.setUint32(pos,e.crc>>>0,true);pos+=4;
      if(e.bigSize){v.setUint32(pos,0xFFFFFFFF,true);pos+=4;v.setUint32(pos,0xFFFFFFFF,true);pos+=4;}
      else{v.setUint32(pos,e.data.length>>>0,true);pos+=4;v.setUint32(pos,e.data.length>>>0,true);pos+=4;}
      v.setUint16(pos,e.nameBytes.length,true);pos+=2;
      v.setUint16(pos,e.localExtra,true);pos+=2;
      u8.set(e.nameBytes,pos);pos+=e.nameBytes.length;
      if(e.bigSize){
        // ZIP64 extended-information extra field: uncompressed then compressed size
        v.setUint16(pos,0x0001,true);pos+=2;
        v.setUint16(pos,16,true);pos+=2;
        set64(v,pos,e.data.length);pos+=8;
        set64(v,pos,e.data.length);pos+=8;
      }
      u8.set(e.compressed,pos);pos+=e.compressed.length;
    }
    progress.update(85+Math.round(endH/Math.max(entries.length,1)*8),
      'Writing files '+(c2+1)+'-'+endH+' / '+entries.length+'...');
    await yieldToUI();
  }

  progress.update(94,'Writing central directory...');
  progress.logTask('Building central directory...','active');
  await yieldToUI();

  for(var i3=0;i3<entries.length;i3++){
    var e2=entries[i3];
    v.setUint32(pos,0x02014b50,true);pos+=4;
    v.setUint16(pos,ver,true);pos+=2;
    v.setUint16(pos,ver,true);pos+=2;
    v.setUint16(pos,flags,true);pos+=2;
    v.setUint16(pos,e2.method,true);pos+=2;
    v.setUint16(pos,e2.time,true);pos+=2;
    v.setUint16(pos,e2.date,true);pos+=2;
    v.setUint32(pos,e2.crc>>>0,true);pos+=4;
    if(e2.bigSize){v.setUint32(pos,0xFFFFFFFF,true);pos+=4;v.setUint32(pos,0xFFFFFFFF,true);pos+=4;}
    else{v.setUint32(pos,e2.data.length>>>0,true);pos+=4;v.setUint32(pos,e2.data.length>>>0,true);pos+=4;}
    v.setUint16(pos,e2.nameBytes.length,true);pos+=2;
    v.setUint16(pos,e2.cdExtra,true);pos+=2;
    v.setUint16(pos,0,true);pos+=2;
    v.setUint16(pos,0,true);pos+=2;
    v.setUint16(pos,e2.directory?0x10:0,true);pos+=2;
    v.setUint32(pos,e2.directory?0x10:0,true);pos+=4;
    if(e2.offset>0xFFFFFFFF){v.setUint32(pos,0xFFFFFFFF,true);pos+=4;}
    else v.setUint32(pos,e2.offset>>>0,true);pos+=4;
    u8.set(e2.nameBytes,pos);pos+=e2.nameBytes.length;
    if(e2.cdExtra){
      v.setUint16(pos,0x0001,true);pos+=2;
      v.setUint16(pos,e2.cdExtra-4,true);pos+=2;
      if(e2.bigSize){set64(v,pos,e2.data.length);pos+=8;set64(v,pos,e2.data.length);pos+=8;}
      if(e2.offset>0xFFFFFFFF){set64(v,pos,e2.offset);pos+=8;}
    }
    if((i3+1)%1000===0)await yieldToUI();
  }

  progress.update(98,'Writing end of central directory...');
  await yieldToUI();

  if(useZip64){
    /* ZIP64 end of central directory record */
    var z64pos=pos;
    v.setUint32(pos,0x06064b50,true);pos+=4;
    set64(v,pos,44);pos+=8;            // size of record (bytes after sig + size field)
    v.setUint16(pos,ver,true);pos+=2;  // version made by
    v.setUint16(pos,ver,true);pos+=2;  // version needed
    v.setUint32(pos,0,true);pos+=4;    // number of this disk
    v.setUint32(pos,0,true);pos+=4;    // disk with central directory
    set64(v,pos,entries.length);pos+=8;// entries on this disk
    set64(v,pos,entries.length);pos+=8;// total entries
    set64(v,pos,cdSize);pos+=8;        // size of central directory
    set64(v,pos,cdOffset);pos+=8;      // offset of central directory
    /* ZIP64 end of central directory locator */
    v.setUint32(pos,0x07064b50,true);pos+=4;
    v.setUint32(pos,0,true);pos+=4;    // disk with zip64 eocd
    set64(v,pos,z64pos);pos+=8;        // offset of zip64 eocd
    v.setUint32(pos,1,true);pos+=4;    // total disks
  }

  /* Standard end of central directory record (fields clamped to max when ZIP64) */
  v.setUint32(pos,0x06054b50,true);pos+=4;
  v.setUint16(pos,0,true);pos+=2;
  v.setUint16(pos,0,true);pos+=2;
  v.setUint16(pos,useZip64?0xFFFF:entries.length,true);pos+=2;
  v.setUint16(pos,useZip64?0xFFFF:entries.length,true);pos+=2;
  v.setUint32(pos,useZip64?0xFFFFFFFF:cdSize>>>0,true);pos+=4;
  v.setUint32(pos,useZip64?0xFFFFFFFF:cdOffset>>>0,true);pos+=4;
  v.setUint16(pos,0,true);pos+=2;

  progress.logTask('ZIP archive assembled successfully','done');
  return new Blob([buf],{type:'application/zip'});
}
/* ---------- keyboard ---------- */
function combo(e){let k=e.key.toLowerCase();if(k===' ')k='space';let c='';if(e.ctrlKey||e.metaKey)c+='ctrl+';if(e.altKey)c+='alt+';if(e.shiftKey)c+='shift+';c+=k;return c;}
function isTypingTarget(e){const t=e.target;return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable||t.classList&&t.classList.contains('monaco-editor'));}
document.addEventListener('keydown',e=>{
  // Exit Zen mode with Escape
  if(e.key==='Escape'&&document.body.classList.contains('zen')){toggleZen();return;}
  // Extension keybindings
  const c=combo(e);
  for(const kb of _extKeybinds){if(kb.key===c){kb.handler();e.preventDefault();return;}}
  const ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&e.altKey&&e.key.toLowerCase()==='z'){e.preventDefault();toggleZen();return;}
  if(ctrl&&e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPalette('cmd');return;}
  if(ctrl&&!e.shiftKey&&(e.key==='+'||e.key==='=')){e.preventDefault();ui.zoom(1);return;}
  if(ctrl&&!e.shiftKey&&e.key==='-'){e.preventDefault();ui.zoom(-1);return;}
  if(ctrl&&!e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPalette('files');return;}
  if(ctrl&&e.shiftKey&&e.key.toLowerCase()==='x'){e.preventDefault();ui.activate('extensions');return;}
  if(ctrl&&e.shiftKey&&e.key.toLowerCase()==='f'){e.preventDefault();ui.activate('search');return;}
  if(ctrl&&e.shiftKey&&e.key.toLowerCase()==='e'){e.preventDefault();ui.activate('explorer');return;}
  if(ctrl&&e.shiftKey&&e.key.toLowerCase()==='s'){e.preventDefault();ui.saveProject();return;}
  if(ctrl&&!e.shiftKey&&e.key.toLowerCase()==='s'){e.preventDefault();ui.save();return;}
  if(ctrl&&!e.shiftKey&&e.key.toLowerCase()==='w'){e.preventDefault();ui.closeActive();return;}
  if(ctrl&&!e.shiftKey&&e.key.toLowerCase()==='b'){e.preventDefault();ui.toggleSidebar();return;}
  if(ctrl&&!e.shiftKey&&e.key.toLowerCase()===','){e.preventDefault();ui.activate('settings');return;}
  if(ctrl&&!e.shiftKey&&e.key==='`'){e.preventDefault();toggleTerminal();return;}
  if(ctrl&&!e.shiftKey&&e.key.toLowerCase()==='n'){e.preventDefault();ui.newProject();return;}
  if(ctrl&&!e.shiftKey&&e.key==='0'){e.preventDefault();ui.resetZoom();return;}
});

/* ---------- boot ---------- */
function renderAll(){renderActivityBar();renderSidebar();renderTabs();renderEditor();renderStatusbar();updateExtCount();buildMenus();}
function boot(){
  // restore installed extensions
  state.extensions=LS.get('extensions',[]);
  state.extensions.forEach(x=>{registerExtensionSnippets(x);installKeybindings(x);installCommands(x);});
  rebuildExtensionRuntime();
  const restored=restoreWorkspace();
  renderActivityBar();renderSidebar();renderTabs();renderStatusbar();updateExtCount();
  if(!restored)renderWelcome();
  else{
    if(state.openFiles.length)toast('Workspace restored ☁️','success',2000);
    renderEditor();
    if(!state.openFiles.length)renderWelcome();
  }
  initMonaco();
  setTimeout(activateStartupExtensions,600);
}
// wire the term head buttons already bound above
window.ui=ui;window.toggleTerminal=toggleTerminal;
boot();
</script>
