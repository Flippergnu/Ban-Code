<!DOCTYPE html>
<html lang="en">
<head><base href="https://d16ilfvy4mv02r.cloudfront.net/workspaces/zcDzJgY7cO0OZ8mDxqxM9NhZGOLGHBa6/cca0ffb3-495e-4d42-b32a-ba189e5bb58c/files/">
<meta charset="UTF-8" />

<title>🚫 Ban Code — Extension-Powered Editor</title>
<!-- Monaco Editor (CDN; internet needed on first load) -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<style>
  :root{
    --bg:#1e1e1e; --sidebar:#252526; --activity:#333333; --border:#2a2a2a;
    --titlebar:#252333; --accent:#007acc; --fg:#cccccc; --dim:#858585;
    --muted:#6b6b6b;
    --hover:rgba(255,255,255,.06); --hoverStrong:rgba(255,255,255,.12); --hoverBtn:rgba(255,255,255,.16);
    --card:#2d2d2d; --cardBorder:#3a3a3a; --inputBg:#3c3c3c; --inputBorder:#454545;
    --selectBg:#094771; --scrollbar:#424242; --scrollbarHover:#4f4f4f;
    --termBg:#161616; --termHead:#2d2d2d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);font-size:13px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:5px;transition:background 0.2s ease}
  ::-webkit-scrollbar-thumb:hover{background:var(--scrollbarHover)}
  button{cursor:pointer;background:none;border:none;color:inherit;font:inherit;transition:background 0.12s ease,transform 0.1s ease}
  button:active{transform:scale(0.97)}
  input,select,textarea{font:inherit}
  .muted{color:var(--dim)}
  #app{height:100vh;display:flex;flex-direction:column;background:var(--bg)}

  /* Title bar */
  #titlebar{height:34px;background:var(--titlebar);display:flex;align-items:center;padding:0 8px;flex-shrink:0;user-select:none;position:relative;z-index:20}
  .brand{font-weight:600;color:var(--fg);font-size:12px;display:flex;align-items:center;gap:6px;min-width:0}
  .brand .logo{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#007acc,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
  #docname{color:var(--dim);font-size:12px;margin-left:6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #menubar{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:1px}
  #menubar>button{padding:5px 10px;border-radius:4px;font-size:12px;color:var(--fg);position:relative}
  #menubar>button:hover,#menubar>button.open{background:var(--hoverStrong)}
  .dropdown{position:absolute;top:100%;left:50%;transform:translateX(-50%);transform-origin:top center;animation:dropIn 0.15s ease;background:var(--sidebar);border:1px solid var(--inputBorder);border-radius:6px;min-width:250px;padding:4px;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .menu-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:4px;font-size:13px;color:var(--fg);width:100%;text-align:left}
  .menu-item:hover{background:var(--selectBg);color:#fff}
  .menu-item.disabled{opacity:.4;pointer-events:none}
  .menu-item .label{flex:1}
  .menu-item .kbd{font-size:11px;color:var(--dim)}
  .menu-item .ic{width:16px;text-align:center;flex-shrink:0}
  .menu-sep{height:1px;background:var(--border);margin:4px 6px}
  #winbtns{margin-left:auto;display:flex;align-items:center;gap:8px}
  .pillow{font-size:11px;padding:2px 9px;border-radius:12px;background:var(--hover);color:var(--dim)}

  #main{flex:1;display:flex;min-height:0}

  /* Activity bar */
  #activitybar{width:46px;background:var(--activity);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:8px;flex-shrink:0}
  .ab-wrap{position:relative}
  .act{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--dim);position:relative;font-size:17px;margin-bottom:2px;transition:all 0.15s ease}
  .act:hover{color:var(--fg);background:var(--hover)}
  .act.active{color:var(--fg);background:var(--hoverStrong)}
  .act.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--accent);border-radius:2px}
  .act-tip{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:9px;background:var(--card);border:1px solid var(--inputBorder);padding:3px 8px;border-radius:4px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:600;color:var(--fg)}
  .ab-wrap:hover .act-tip{opacity:1}
  #activitybar .spacer{flex:1}

  /* Sidebar */
  #sidebar{width:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;opacity:0;transition:width 0.2s ease,opacity 0.2s ease}
  #sidebar.open{width:300px;opacity:1}
  .side-head{padding:12px 14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;justify-content:space-between}
  .side-body{flex:1;overflow-y:auto;padding:0 10px 12px}
  .tree-item{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--fg);white-space:nowrap;transition:background 0.1s ease}
  .tree-item:hover{background:var(--hover)}
  .tree-item.active{background:var(--selectBg);color:#fff}
  .tree-item .name{overflow:hidden;text-overflow:ellipsis}
  .tree-item .tbtn{background:transparent;opacity:0;margin-left:auto;display:flex;gap:2px}
  .tree-item:hover .tbtn{opacity:1}
  .tree-item .tbtn button{background:var(--hover);padding:1px 4px;border-radius:3px;color:var(--dim)}
  .tree-item .tbtn button:hover{background:var(--hoverBtn);color:var(--fg)}
  .child{display:none;transition:max-height 0.15s ease}.child.open{display:block}

  /* Editor pane */
  #editor-pane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  #tabs{height:34px;background:var(--sidebar);display:flex;align-items:flex-end;overflow-x:auto;border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
  .tab{display:flex;align-items:center;gap:7px;padding:6px 14px;font-size:13px;color:var(--dim);max-width:190px;min-width:120px;cursor:pointer;border-top:2px solid transparent;user-select:none;flex-shrink:0;transition:background 0.12s ease,color 0.12s ease,border-color 0.12s ease}
  .tab:hover{background:var(--hover)}
  .tab.active{background:var(--bg);border-top-color:var(--accent);color:var(--fg)}
  .tab .tname{overflow:hidden;text-overflow:ellipsis;flex:1}
  .tab .dirty{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
  .tab .close{opacity:0;border-radius:4px;padding:1px;color:var(--muted);flex-shrink:0}
  .tab:hover .close{opacity:1}
  .tab .close:hover{background:var(--hoverBtn);color:var(--fg)}
  #editor{flex:1;min-height:0;position:relative}

  /* Welcome */
  .welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);padding:24px;overflow-y:auto}
  .welcome h1{font-size:34px;font-weight:300;color:var(--fg);margin:14px 0 6px}
  .welcome .sub{font-size:14px;margin-bottom:26px}
  .welcome .actions{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;justify-content:center}
  .btn{padding:10px 16px;border-radius:6px;background:var(--inputBg);color:var(--fg);font-size:13px;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{background:var(--hoverStrong)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:#1a8ad8}
  .btn.danger{background:#3a2230;color:#e6a0b0}
  .btn.danger:hover{background:#4a2b3a}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:5px}
  .btn.block{width:100%;justify-content:center;margin-top:6px}
  .welcome .grid{display:grid;grid-template-columns:repeat(2,minmax(210px,1fr));gap:10px;max-width:560px;font-size:13px}
  .welcome .kbd{background:var(--sidebar);border:1px solid var(--border);padding:10px 12px;border-radius:6px;display:flex;gap:10px;align-items:center}
  .welcome .k{font-family:ui-monospace,Consolas,monospace;color:var(--accent)}
  .welcome .foot{margin-top:24px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}

  /* Terminal */
  #term-resize{height:5px;background:transparent;flex-shrink:0;cursor:ns-resize;display:none}
  #term-resize.vis{display:block}
  #term-resize:hover{background:var(--accent)}
  #terminal{background:var(--termBg);border-top:1px solid var(--inputBorder);flex-direction:column;flex-shrink:0;height:0;overflow:hidden;opacity:0;transition:height 0.2s ease,opacity 0.15s ease}
  #terminal.open{opacity:1}
  #term-head{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--termHead);font-size:12px;color:var(--fg)}
  #term-head span.c{flex:1}
  #term-head .tb{color:var(--dim);padding:1px 5px;border-radius:3px}
  #term-head .tb:hover{background:var(--hoverStrong);color:var(--fg)}
  #term-body{flex:1;overflow-y:auto;padding:8px 14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
  .term-line{padding:1px 0;white-space:pre-wrap;word-break:break-word}
  .term-input{color:#98c379}.term-error{color:#e06c75}.term-info{color:#61afef}.term-out{color:var(--fg)}
  .term-cmd{display:flex;align-items:center;color:var(--fg);margin-top:2px}
  .term-cmd .prompt{color:#98c379;margin-right:8px;white-space:nowrap}
  .term-cmd input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-family:inherit;font-size:13px}

  /* Status bar */
  #statusbar{height:24px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px;flex-shrink:0;user-select:none}
  #statusbar .grp{display:flex;align-items:center;gap:4px}
  .sb{display:flex;align-items:center;gap:5px;padding:2px 7px;border-radius:3px;transition:background 0.1s ease}
  .sb:hover{background:rgba(255,255,255,.16)}
  .sb{cursor:pointer}

  /* Toasts */
  #toasts{position:fixed;right:16px;bottom:16px;z-index:5000;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--card);border:1px solid var(--inputBorder);border-left:3px solid var(--accent);padding:10px 14px;border-radius:6px;color:var(--fg);font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);min-width:200px;max-width:360px;animation:tin .2s ease}
  .toast.error{border-left-color:#e06c75}
  .toast.success{border-left-color:#98c379}
  .toast.out{animation:tout 0.25s ease forwards}
  @keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  @keyframes dropIn{from{transform:translateX(-50%) scaleY(0.96);opacity:0}to{transform:translateX(-50%) scaleY(1);opacity:1}}
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes modalIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes tout{to{transform:translateX(120%);opacity:0}}

  /* Overlays */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:4000}
  .overlay.open{display:flex;animation:fadeIn 0.15s ease}
  .palette{width:560px;max-width:92vw;background:var(--sidebar);border:1px solid var(--inputBorder);border-radius:8px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:fadeSlideIn 0.12s ease}
  .palette input{width:100%;background:var(--inputBg);border:none;outline:none;color:var(--fg);padding:14px 16px;font-size:15px}
  .palette-list{max-height:300px;overflow-y:auto;padding:6px}
  .palette-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--fg)}
  .palette-item:hover,.palette-item.sel{background:var(--selectBg);color:#fff}
  .palette-item .pk{font-size:11px;color:var(--dim)}
  .palette-item .pt{color:var(--dim);font-size:11px;margin-left:auto}
  .modal{background:var(--sidebar);border:1px solid var(--inputBorder);border-radius:8px;padding:20px;width:440px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:modalIn 0.15s ease}
  .modal h2{font-size:16px;color:var(--fg);margin-bottom:6px}
  .modal p{font-size:13px;color:var(--dim);margin-bottom:14px;line-height:1.5}
  .modal input[type=text]{width:100%;background:var(--inputBg);border:none;outline:none;color:var(--fg);padding:9px 12px;border-radius:6px;margin-bottom:12px}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  .modal textarea{width:100%;background:var(--bg);border:1px solid var(--inputBorder);outline:none;color:var(--fg);padding:10px;border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:120px;resize:vertical;white-space:pre}

  /* Extensions */
  .dropzone{border:2px dashed var(--cardBorder);border-radius:8px;padding:18px;text-align:center;color:var(--dim);font-size:13px;margin-bottom:10px;transition:.15s}
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);background:rgba(0,122,204,.07);color:var(--fg)}
  .import-progress{padding:24px;text-align:center;min-width:360px;max-width:500px}
  .import-progress h3{margin-bottom:14px;font-size:15px}
  .import-progress .bar-wrap{background:var(--inputBg);border-radius:6px;height:18px;overflow:hidden;margin:10px 0}
  .import-progress .bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .15s ease;min-width:0}
  .import-progress .stats{font-size:12px;color:var(--dim);margin-top:8px}
  .import-progress .btn-row{margin-top:16px;display:flex;gap:8px;justify-content:center}
  .ext-grid{display:flex;flex-direction:column;gap:10px}
  .ext-card{background:var(--card);border:1px solid var(--cardBorder);border-radius:8px;padding:12px;transition:border-color 0.2s ease,box-shadow 0.2s ease}
  .ext-card:hover{border-color:var(--dim);box-shadow:0 0 12px rgba(0,122,204,.08)}
  .ext-top{display:flex;gap:10px;align-items:flex-start}
  .ext-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#007acc,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .ext-info{flex:1;min-width:0}
  .ext-name{font-size:14px;color:var(--fg);font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ext-ver{color:var(--dim);font-weight:400;font-size:11px}
  .ext-pub{font-size:11px;color:var(--dim);margin-top:1px}
  .ext-desc{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.4}
  .ext-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .chip{font-size:10px;background:var(--bg);border:1px solid var(--cardBorder);color:var(--dim);padding:2px 8px;border-radius:11px}
  .ext-actions{display:flex;gap:8px;margin-top:10px}
  .sec-title{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px}
  .divider{height:1px;background:var(--border);margin:8px 0}
  .mark{background:#613214;color:#fff;border-radius:2px;padding:0 1px}
  .srch-res-line{display:flex;gap:6px;padding:3px 6px;font-size:12px;cursor:pointer;border-radius:4px;color:var(--fg);transition:background 0.1s ease}
  .srch-res-line:hover{background:var(--selectBg)}
  .srch-res-line .ln{color:var(--dim);min-width:28px;text-align:right;flex-shrink:0}
  .srch-res-line code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Consolas,monospace}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
  .set-row .lbl{font-size:13px;color:var(--fg)}.set-row .desc{font-size:11px;color:var(--dim);margin-top:2px}
  .set-row select,.set-row input[type=number]{background:var(--inputBg);color:var(--fg);border:none;outline:none;padding:5px 8px;border-radius:5px}
  .switch{position:relative;width:36px;height:20px;background:var(--muted);border-radius:10px;transition:background 0.2s ease;flex-shrink:0;cursor:pointer}
  .switch.on{background:var(--accent)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:0.2s ease}
  .switch.on::after{left:18px}
  .codeblock{background:var(--bg);border:1px solid var(--cardBorder);border-radius:6px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#9aa2fe;white-space:pre-wrap;max-height:200px;overflow:auto}
  .manifest-card{background:var(--card);border:1px solid var(--cardBorder);border-radius:8px;padding:12px}
  .manifest-card h4{color:var(--fg);font-size:13px;margin-bottom:6px}
  #dropmask{position:fixed;inset:0;background:rgba(0,122,204,.12);border:3px dashed var(--accent);z-index:6000;display:none;pointer-events:none}
  #dropmask .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:600}
  /* Context Menu */
  .ctx-menu{position:fixed;z-index:8000;background:var(--sidebar);border:1px solid var(--inputBorder);border-radius:6px;padding:4px 0;min-width:200px;max-width:280px;box-shadow:0 8px 30px rgba(0,0,0,.55);animation:fadeSlideIn .1s ease;font-size:13px;user-select:none}
  .ctx-menu .ctx-item{display:flex;align-items:center;gap:8px;padding:6px 14px;color:var(--fg);cursor:pointer;transition:background .08s ease}
  .ctx-menu .ctx-item:hover{background:var(--selectBg);color:#fff}
  .ctx-menu .ctx-item.danger{color:#e06c75}
  .ctx-menu .ctx-item.danger:hover{background:#4a2b3a;color:#f0a0b0}
  .ctx-menu .ctx-item .ctx-key{margin-left:auto;color:var(--dim);font-size:11px}
  .ctx-menu .ctx-sep{height:1px;background:var(--border);margin:4px 8px}
  .ctx-menu .ctx-label{padding:4px 14px 2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

  /* Export progress */
  .export-progress{padding:24px;text-align:center;min-width:380px;max-width:480px}
  .export-progress h3{margin-bottom:14px;font-size:15px}
  .export-progress .bar-wrap{background:var(--inputBg);border-radius:6px;height:18px;overflow:hidden;margin:10px 0}
  .export-progress .bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .15s ease;min-width:0}
  .export-progress .stats{font-size:12px;color:var(--dim);margin-top:8px}
  .export-progress .task-log{margin-top:12px;max-height:160px;overflow-y:auto;text-align:left;background:var(--bg);border:1px solid var(--cardBorder);border-radius:6px;padding:8px 10px;font-size:11px;font-family:ui-monospace,Consolas,monospace;color:var(--dim);line-height:1.6}
  .export-progress .task-log .task-entry{padding:1px 0}
  .export-progress .task-log .task-entry.done{color:#98c379}
  .export-progress .task-log .task-entry.active{color:var(--accent)}
  .export-progress .task-log .task-entry.error{color:#e06c75}
  .export-progress .task-summary{margin-top:12px;text-align:left;background:var(--card);border:1px solid var(--cardBorder);border-radius:6px;padding:10px 14px;font-size:12px}
  .export-progress .task-summary .sum-row{display:flex;justify-content:space-between;padding:2px 0;color:var(--fg)}
  .export-progress .task-summary .sum-label{color:var(--dim)}
  .icon-btn{width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--inputBg);color:var(--fg);font-size:15px}
  .icon-btn:hover{background:var(--hoverStrong)}
  /* Zen mode */
  body.zen #activitybar,body.zen #sidebar,body.zen #tabs,body.zen #statusbar,body.zen #titlebar,body.zen #terminal,body.zen #term-resize{display:none!important}
  /* Extension-contributed sidebar views */
  .ext-view{padding:6px 2px;font-size:13px;color:var(--fg);line-height:1.5}
  .ext-view h3{margin:6px 0 8px;font-size:14px}
  .ext-view a{color:var(--accent)}
  /* Media & preview viewers */
  .viewer{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);overflow:auto;padding:22px}
  .viewer .checker{background:repeating-conic-gradient(#262626 0% 25%, #303030 0% 50%) 50% / 18px 18px;border-radius:6px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .viewer img{display:block;max-width:100%;border-radius:4px}
  .viewer .vmeta{color:var(--dim);font-size:12px;text-align:center}
  .viewer .vbig{font-size:64px;line-height:1}
  .viewer audio{width:min(520px,90%)}
  .viewer video{max-width:92%;max-height:70vh;border-radius:6px;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.45)}

<script>
/* =========================================================================
   BAN CODE — single-file code editor with a JSON extension system
   Extensions are plain .json files (VS Code manifest style) that can add:
   commands, color themes, code snippets, terminal commands & keybindings.
   ========================================================================= */

/* ---------- helpers ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=> 'n'+Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONO="ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Consolas,Monaco,monospace";
let _toastSeq=0;
function toast(msg,type='info',ms=2600){
  const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},260);},ms);
}
const LS={ get(k,d){try{const v=localStorage.getItem('ban.'+k);return v==null?d:JSON.parse(v);}catch(e){return d}},
  set(k,v){try{localStorage.setItem('ban.'+k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem('ban.'+k);}catch(e){}} };

/* ---------- global switch helper ---------- */
function sw(sel,cb){const el=$(sel);if(!el)return;el.onclick=()=>{el.classList.toggle('on');cb(el.classList.contains('on'));};}

/* ---------- languages ---------- */
const LANG_MAP={js:'javascript',jsx:'javascript',mjs:'javascript',cjs:'javascript',ts:'typescript',tsx:'typescript',mts:'typescript',py:'python',pyw:'python',rb:'ruby',go:'go',rs:'rust',java:'java',c:'c',h:'c',cpp:'cpp',cc:'cpp',cxx:'cpp',hpp:'cpp',cs:'csharp',php:'php',swift:'swift',kt:'kotlin',html:'html',htm:'html',css:'css',scss:'scss',less:'less',sass:'scss',json:'json',jsonc:'json',yaml:'yaml',yml:'yaml',xml:'xml',svg:'xml',md:'markdown',markdown:'markdown',sh:'shell',bash:'shell',zsh:'shell',sql:'sql',ini:'ini',toml:'ini',conf:'ini',txt:'plaintext',vue:'html',svelte:'html',lua:'lua',r:'r',dart:'dart',fs:'fsharp',pl:'perl'};
const _extLangMap={},_extFileIcons={}; // filled by extension "languages" & "fileIcons" contributions
function langFromName(name){const e=name.includes('.')?name.split('.').pop().toLowerCase():'';return _extLangMap[e]||LANG_MAP[e]||'plaintext';}
function fileIcon(name){const e=name.split('.').pop().toLowerCase();if(_extFileIcons[e])return _extFileIcons[e];const m={js:'🟨',jsx:'🟨',ts:'🟦',tsx:'🟦',py:'🐍',json:'🧾',html:'🟧',css:'🎨',scss:'🎨',md:'📄',java:'☕',go:'🐹',rs:'🦀',c:'🔵',cpp:'➕',csharp:'💠',php:'🐘',sh:'🐚',sql:'🗄️',yaml:'⚙️',xml:'🧩',svg:'🖼️',txt:'📃',lock:'🔒',png:'🖼️',jpg:'🖼️',gif:'🖼️',webp:'🖼️',pdf:'📕',zip:'🗜️'};return m[e]||'📄';}

/* ---------- binary/media files (image & audio/video viewers) ---------- */
function extOf(name){return name.includes('.')?name.split('.').pop().toLowerCase():'';}
const IMAGE_EXTS=new Set(['png','jpg','jpeg','gif','webp','bmp','ico','cur','avif','svg']);
const AUDIO_EXTS=new Set(['mp3','wav','ogg','oga','m4a','flac','aac','opus','weba']);
const VIDEO_EXTS=new Set(['mp4','m4v','webm','mov','mkv']);
const MIME_BY_EXT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',ico:'image/x-icon',cur:'image/x-icon',avif:'image/avif',svg:'image/svg+xml',mp3:'audio/mpeg',wav:'audio/wave',ogg:'audio/ogg',oga:'audio/ogg',m4a:'audio/mp4',flac:'audio/flac',aac:'audio/aac',opus:'audio/opus',weba:'audio/webm',mp4:'video/mp4',m4v:'video/mp4',webm:'video/webm',mov:'video/quicktime',mkv:'video/x-matroska'};
function mediaKindOf(name){const e=extOf(name);if(IMAGE_EXTS.has(e))return'image';if(AUDIO_EXTS.has(e))return'audio';if(VIDEO_EXTS.has(e))return'video';return null;}
/* Read any file: media types become data URLs so they can be viewed, everything else stays text */
async function readFileSmart(file,nameHint){
  nameHint=nameHint||file.name;
  const kind=mediaKindOf(nameHint);
  if(kind&&extOf(nameHint)!=='svg'){ // svg stays editable text
    try{
      const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
      return {content:String(dataUrl),binary:true,mime:MIME_BY_EXT[extOf(nameHint)]||file.type||'application/octet-stream'};
    }catch(e){/* fall through to text */}
  }
  const content=await file.text();
  return {content,binary:false,mime:''};
}
/* Best <img>/<audio>/<video> source for a node (data URL, or svg text wrapped) */
function mediaSrcFor(node){
  const c=node.content||'';
  if(c.startsWith('data:'))return c;
  if(extOf(node.name)==='svg')return 'data:image/svg+xml;utf8,'+encodeURIComponent(c);
  return '';
}

/* ---------- state ---------- */
const DEFAULT_SETTINGS={theme:'ban-dark',fontSize:14,tabSize:2,wordWrap:true,minimap:true,lineNumbers:true,bracketPairColorization:true,cursorBlinking:'smooth',
  autoSave:true,restoreSession:true,ligatures:true,lineHeight:0,indentGuides:true,stickyScroll:false,smoothCaret:true,renderWhitespace:'selection',zenMode:false};
const state={
  fileList:[], openFiles:[], activeFileId:null,
  activityView:'explorer', sidebarVisible:true,
  terminalVisible:false,
  searchQuery:'',
  extensions:[],
  projectJson:null, projectDirty:false,
  settings:Object.assign({},DEFAULT_SETTINGS,LS.get('settings',{})),
  monaco:null, monacoReady:false, editor:null,
  paletteMode:'cmd', paletteItems:[], paletteSel:0,
  cursor:{line:1,col:1,selChars:0},
  uiOverride:{}, lazyImport:false,
  viewMode:'', viewFileId:'', previewMode:{},
};
function persist(){LS.set('settings',state.settings);LS.set('extensions',state.extensions);}
const persistSettings=()=>LS.set('settings',state.settings);

let _termHeight=210; // remember terminal height across toggles
var _pendingFileRefs=new Map(); // path->File for lazy loading
var _pendingEntryRefs=new Map(); // path->FileSystemFileEntry for lazy loading

/* ---------- file system ---------- */
function findNode(nodes,id){for(const n of nodes){if(n.id===id)return n;if(n.children){const r=findNode(n.children,id);if(r)return r;}}return null;}
function removeNode(nodes,id){const o=[];for(const n of nodes){if(n.id===id)continue;if(n.children)n.children=removeNode(n.children,id);o.push(n);}return o;}
function defaultContent(name){const l=langFromName(name);
  if(l==='html')return '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>'+name+'</title>\n</head>\n<body>\n  \n</body>\n</html>';
  if(l==='css')return '/* '+name+' */\n\n';
  if(l==='json')return '{\n  \n}';
  if(l==='markdown')return '# '+name.replace(/\.md$/,'')+'\n\n';
  if(l==='javascript'||l==='typescript')return '// '+name+'\n\n';
  if(l==='python')return '#'+name+'\n\n';
  return '';}
function makeNode(name,type,parentPath){const id=uid();const node={id,name,type};if(type==='folder'){node.children=[];node.isOpen=true;}else{node.language=langFromName(name);node.content='';node.path=(parentPath?parentPath+'/':'')+name;}return node;}
function createFile(name,content,language,parentId,noRender){
  if(!state.fileList.length&&!noRender)return toast('Open a project first','info');
  const parent=parentId?findNode(state.fileList,parentId):state.fileList[0];
  const node={id:uid(),name,type:'file',language:language||langFromName(name),content:content||defaultContent(name),path:(parent&&parent.type==='folder'?(parent.path?(parent.path+'/'):''):'')+name};
  if(parent&&parent.type==='folder')parent.children.push(node);else state.fileList.push(node);
  state.projectDirty=true;if(!noRender){openNode(node);renderExplorer();renderStatusbar();}return node;}
function createFolder(name,parentId,noRender){
  if(!state.fileList.length&&!noRender)return null;
  const parent=parentId?findNode(state.fileList,parentId):state.fileList[0];
  const node={id:uid(),name,type:'folder',isOpen:true,children:[],path:(parent&&parent.type==='folder'?(parent.path?(parent.path+'/'):''):'')+name};
  if(parent&&parent.type==='folder')parent.children.push(node);else state.fileList.push(node);
  state.projectDirty=true;if(!noRender){renderExplorer();renderStatusbar();}return node;}
function openNode(node,opts){
  if(node.type!=='file')return;
  let of=state.openFiles.find(f=>f.id===node.id);
  if(!of){of={id:node.id,name:node.name,content:node.content||'',language:node.language||'plaintext',path:node.path||node.name,modified:false,binary:!!node.binary,mime:node.mime||''};state.openFiles.push(of);}
  state.activeFileId=node.id;
  renderTabs();renderEditor();renderStatusbar();setDocName(node.name);
  if(opts&&opts.line&&state.monacoReady)setTimeout(()=>jumpToLine(opts.line,opts.query),80);
  // Lazy load content from stored file/entry reference (for large project imports)
  if(!node.content&&node.path){
    const apply=(rd)=>{applyLazyContent(node,rd);};
    if(_pendingFileRefs.has(node.path)){
      const file=_pendingFileRefs.get(node.path);_pendingFileRefs.delete(node.path);
      readFileSmart(file,node.name).then(apply).catch(()=>{});
    }else if(_pendingEntryRefs.has(node.path)){
      const entry=_pendingEntryRefs.get(node.path);_pendingEntryRefs.delete(node.path);
      entry.file(file=>{readFileSmart(file,node.name).then(apply).catch(()=>{});},()=>{});
    }
  }
}
function applyLazyContent(node,rd){
  node.content=rd.content;
  if(rd.binary){node.binary=true;node.mime=rd.mime;}
  const f=state.openFiles.find(x=>x.id===node.id);
  if(f){f.content=rd.content;f.binary=node.binary;f.mime=node.mime;}
  if(state.activeFileId===node.id){
    // The pane was rendered while this file was still an empty placeholder.
    // Two things must happen before a re-render can show the loaded content:
    //   1) Discard the cached Monaco model for this file. It was created empty
    //      when the tab opened, and `monaco.editor.getModel(uri)` would return
    //      that empty model again on rebuild (leaving the code editor blank).
    //   2) Clear the cached view mode so renderEditor() rebuilds the pane.
    //      Viewer modes (image/audio/video/HTML) read file.content directly,
    //      so they too need the rebuild to display the freshly-loaded data.
    if(window.monaco){
      try{
        const cur=f||node;
        const uri=monaco.Uri.parse('inmemory://'+encodeURIComponent(cur.path||cur.name));
        const m=monaco.editor.getModel(uri);
        if(m)m.dispose();
      }catch(e){}
    }
    state.viewMode='';
    state.viewFileId='';
    renderEditor();
  }
}
function closeFile(id){
  const idx=state.openFiles.findIndex(f=>f.id===id);
  state.openFiles=state.openFiles.filter(f=>f.id!==id);
  if(state.activeFileId===id){const a=state.openFiles;state.activeFileId=a.length?a[Math.min(idx,a.length-1)].id:null;}
  renderTabs();renderEditor();renderStatusbar();
  setDocName(state.openFiles.find(f=>f.id===state.activeFileId)?.name||'Welcome');}
function updateDocContent(id,content){
  const f=state.openFiles.find(x=>x.id===id);if(!f)return;
  f.content=content;f.modified=true;state.projectDirty=true;renderTabs();renderStatusbar();
  // sync into project tree
  const node=findNode(state.fileList,id);
  if(node)node.content=content;
  // live-refresh HTML preview if visible
  if(state.viewMode==='htmlprev')schedulePreviewRefresh();
}
function currentOpen(){return state.openFiles.find(f=>f.id===state.activeFileId)||null;}
function setDocName(n){$('#docname').textContent=n||'Welcome';}

/* ---------- welcome ---------- */
function renderWelcome(){
  const w=$('#welcome');if(!w)return;
  w.innerHTML='<div style="font-size:60px">🚫</div>'
    +'<h1>Welcome to Ban Code</h1><div class="sub">A lightweight, extension-powered code editor — v3.0</div>'
    +'<div class="actions">'
    +'<button class="btn primary" onclick="ui.newProject()">🆕 New Project</button>'
    +'<button class="btn" onclick="ui.loadProjectJson()">📂 Open JSON</button>'
    +'<button class="btn" onclick="ui.importFolder()">📦 Import Folder</button>'
    +'<button class="btn" onclick="ui.installExtension()">🧩 Install Extension</button>'
    +'</div>'
    +'<div class="grid">'
    +'<div class="kbd"><span>💾</span><div><span class="k">Ctrl+S</span><div class="muted">Save file</div></div></div>'
    +'<div class="kbd"><span>🧩</span><div><span class="k">Ctrl+Shift+P</span><div class="muted">Command Palette</div></div></div>'
    +'<div class="kbd"><span>⚡</span><div><span class="k">Ctrl+`</span><div class="muted">Toggle Terminal</div></div></div>'
    +'<div class="kbd"><span>📜</span><div><span class="k">Ctrl+P</span><div class="muted">Quick Open</div></div></div>'
    +'<div class="kbd"><span>🔍</span><div><span class="k">Ctrl+Shift+F</span><div class="muted">Search everywhere</div></div></div>'
    +'<div class="kbd"><span>🧘</span><div><span class="k">Ctrl+Alt+Z</span><div class="muted">Zen Mode</div></div></div>'
    +'<div class="kbd"><span>🖱️</span><div><span class="k">Middle-click tab</span><div class="muted">Close tab · right-click for menu</div></div></div>'
    +'<div class="kbd"><span>☁️</span><div><span class="k">Auto-save</span><div class="muted">Workspace restores on reload</div></div></div>'
    +'</div>'
    +'<div class="foot">Extensions can restyle the whole UI — colors, corners, fonts, custom side panels,<br>status bar &amp; menu items 🎨 — and even run JavaScript via the <b>ban</b> API.<br>'
    +'Installed extensions: <b id="wfec">0</b></div>';
  const wf=$('#wfec');if(wf)wf.textContent=state.extensions.length;
}

/* ---------- tabs ---------- */
function renderTabs(){
  const t=$('#tabs');if(!t)return;
  if(!state.openFiles.length){t.innerHTML='<div style="padding:8px 14px;font-size:12px;color:var(--dim)">No files open</div>';return;}
  t.innerHTML=state.openFiles.map(f=>{
    const act=f.id===state.activeFileId;
    return '<div class="tab '+(act?'active':'')+'" data-id="'+f.id+'"><span>'+fileIcon(f.name)+'</span>'
      +'<span class="tname">'+esc(f.name)+'</span>'
      +(f.modified?'<span class="dirty"></span>':'')
      +'<span class="close" data-close="'+f.id+'">✕</span></div>';
  }).join('');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-close]');
  if(c){e.stopPropagation();closeFile(c.getAttribute('data-close'));return;}
  const tab=e.target.closest('.tab');
  if(tab&&!e.target.closest('.close')){state.activeFileId=tab.getAttribute('data-id');renderTabs();renderEditor();renderStatusbar();}
});
/* Tab middle-click close + right-click tab menu */
$('#tabs').addEventListener('auxclick',e=>{if(e.button===1){const tab=e.target.closest('.tab');if(tab){e.preventDefault();closeFile(tab.getAttribute('data-id'));}}});
$('#tabs').addEventListener('contextmenu',e=>{const tab=e.target.closest('.tab');if(!tab)return;e.preventDefault();showTabCtxMenu(e.clientX,e.clientY,tab.getAttribute('data-id'));});
function showTabCtxMenu(x,y,id){
  const f=state.openFiles.find(o=>o.id===id);
  let h='<div class="ctx-label">Editor Tab</div>'
    +'<div class="ctx-item" onclick="ctxTab(\''+id+'\',\'close\')">✕ Close</div>'
    +'<div class="ctx-item" onclick="ctxTab(\''+id+'\',\'others\')">⧉ Close Others</div>'
    +'<div class="ctx-item" onclick="ctxTab(null,\'all\')">🗙 Close All</div>';
  if(f)h+='<div class="ctx-sep"></div><div class="ctx-item" onclick="ctxTab(\''+id+'\',\'path\')">🔗 Copy Path</div>';
  openCtxMenuAt(x,y,h);
}
window.ctxTab=(id,op)=>{
  if(op==='close'&&id)closeFile(id);
  else if(op==='others'&&id)state.openFiles.filter(o=>o.id!==id).slice().forEach(o=>closeFile(o.id));
  else if(op==='all')state.openFiles.slice().forEach(o=>closeFile(o.id));
  else if(op==='path'&&id){const o=state.openFiles.find(z=>z.id===id);if(o)navigator.clipboard.writeText(o.path||o.name).then(()=>toast('Path copied','success',1400)).catch(()=>{});}
  hideCtxMenu();
};

/* ---------- explorer ---------- */
const _TREE_PAGE_SIZE=500; // Keep the DOM responsive while allowing arbitrarily large folders.
const _TREE_PAGE_STEP=1000;

function renderExplorer(){
  const body=$('#side-body');if(!body||state.activityView!=='explorer')return;
  body.innerHTML='<div class="sec-title">WORKSPACE</div>'
    +'<div id="tree"></div>'
    +'<div class="divider"></div>'
    +(state.fileList.length
      ?'<div style="display:flex;gap:6px;flex-wrap:wrap">'
        +'<button class="btn sm" onclick="ui.newFile()">＋ File</button>'
        +'<button class="btn sm" onclick="ui.newFolder()">＋ Folder</button>'
        +'<button class="btn sm" onclick="ui.importFilesInto()">📥 Files</button>'
        +'<button class="btn sm" onclick="ui.importFolderInto()">📥 Folder</button>'
        +'<button class="btn sm" onclick="toggleAll(true)">⊞ All</button>'
        +'</div>'
      :'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" onclick="ui.newProject()">🆕 New</button><button class="btn sm" onclick="ui.loadProjectJson()">📂 Open</button><button class="btn sm" onclick="ui.importFolder()">📦 Import Folder</button></div>')
    +'<button class="btn sm block" onclick="ui.saveProject()">💾 Download JSON</button>'
    +'<button class="btn sm block" onclick="ui.exportZip()">📦 Export as ZIP</button>';
  const tree=$('#tree');
  if(!state.fileList.length){tree.innerHTML='<div class="muted" style="padding:12px;text-align:center;font-size:12px">Empty workspace.<br>Create or open a project.</div>';return;}
  renderNodesInto(state.fileList,tree,0);
}

function treePageSize(node){
  return Math.max(_TREE_PAGE_SIZE, Number(node._treeVisibleCount)||0);
}

function appendTreeMoreButton(container,folder,depth,shown,total){
  const more=document.createElement('div');
  more.className='tree-more';
  more.style.cssText='padding:6px '+(8+depth*16)+'px;display:flex;gap:6px;align-items:center;flex-wrap:wrap';
  more.innerHTML='<span class="muted" style="font-size:11px">'+
    (total-shown).toLocaleString()+' more item'+(total-shown===1?'':'s')+'</span>'+
    '<button class="btn sm" data-tree-more="'+folder.id+'">Show more</button>'+
    '<button class="btn sm" data-tree-all="'+folder.id+'">Show all</button>';
  container.appendChild(more);
}

function renderNodesInto(nodes,container,depth){
  if(!nodes||!nodes.length)return;
  const frag=document.createDocumentFragment();

  for(let i=0;i<nodes.length;i++){
    const n=nodes[i];
    const row=document.createElement('div');
    row.className='tree-item';
    row.setAttribute('data-nid',n.id);

    if(n.type==='folder'){
      row.innerHTML='<span>'+(n.isOpen?'📂':'📁')+'</span><span class="name">'+esc(n.name)+'</span>'
        +'<span class="tbtn"><button data-nf="'+n.id+'" title="New file">＋</button><button data-nd="'+n.id+'" title="New folder">📁</button><button data-if="'+n.id+'" title="Import files">📥</button><button data-idir="'+n.id+'" title="Import folder">📦</button><button data-rm="'+n.id+'" title="Delete">🗑</button></span>';
      row.style.paddingLeft=(8+depth*16)+'px';
      frag.appendChild(row);

      const ch=document.createElement('div');
      ch.className='child'+(n.isOpen?' open':'');
      ch.setAttribute('data-cid',n.id);
      ch.setAttribute('data-depth',depth+1);

      if(n.isOpen&&n.children&&n.children.length){
        const shown=Math.min(n.children.length,treePageSize(n));
        renderNodesInto(n.children.slice(0,shown),ch,depth+1);
        if(shown<n.children.length)appendTreeMoreButton(ch,n,depth+1,shown,n.children.length);
      }
      frag.appendChild(ch);
    }else{
      if(n.id===state.activeFileId)row.className+=' active';
      row.innerHTML='<span>'+fileIcon(n.name)+'</span><span class="name">'+esc(n.name)+'</span>'
        +'<span class="tbtn"><button data-rm="'+n.id+'" title="Delete">🗑</button></span>';
      row.style.paddingLeft=(8+depth*16)+'px';
      frag.appendChild(row);
    }
  }
  container.appendChild(frag);
}

function showMoreTreeItems(id,all){
  const node=findNode(state.fileList,id);
  if(!node||node.type!=='folder'||!node.children)return;
  if(all){
    node._treeVisibleCount=node.children.length;
  }else{
    node._treeVisibleCount=Math.min(node.children.length,treePageSize(node)+_TREE_PAGE_STEP);
  }
  renderExplorer();
  const child=document.querySelector('[data-cid="'+id+'"]');
  if(child)child.scrollIntoView({block:'nearest'});
}

function toggleFolderNode(id){
  const node=findNode(state.fileList,id);if(!node||node.type!=='folder')return;
  node.isOpen=!node.isOpen;
  const ch=document.querySelector('[data-cid="'+id+'"]');
  if(!ch){renderExplorer();return;}
  const row=ch.previousElementSibling;
  if(node.isOpen){
    ch.classList.add('open');
    ch.innerHTML='';
    if(node.children&&node.children.length){
      const depth=parseInt(ch.getAttribute('data-depth'))||0;
      const shown=Math.min(node.children.length,treePageSize(node));
      renderNodesInto(node.children.slice(0,shown),ch,depth);
      if(shown<node.children.length)appendTreeMoreButton(ch,node,depth,shown,node.children.length);
    }
    if(row&&row.children[0])row.children[0].textContent='📂';
  }else{
    ch.classList.remove('open');ch.innerHTML='';
    if(row&&row.children[0])row.children[0].textContent='📁';
  }
}

/* Event delegation for tree interactions — single listener instead of per-node handlers */
var _documentTreeHandler=function(e){
  const more=e.target.closest('#tree [data-tree-more]');
  if(more){
    e.stopPropagation();
    showMoreTreeItems(more.getAttribute('data-tree-more'),false);
    return;
  }
  const all=e.target.closest('#tree [data-tree-all]');
  if(all){
    e.stopPropagation();
    showMoreTreeItems(all.getAttribute('data-tree-all'),true);
    return;
  }

  const btn=e.target.closest('#tree .tbtn button');
  if(btn){
    e.stopPropagation();
    const v=btn.getAttribute('data-nf');if(v){ui.newFileAt(v);return;}
    const v2=btn.getAttribute('data-nd');if(v2){ui.newFolderAt(v2);return;}
    const v3=btn.getAttribute('data-if');if(v3){ui.importFilesAt(v3);return;}
    const v4=btn.getAttribute('data-idir');if(v4){ui.importFolderAt(v4);return;}
    const v5=btn.getAttribute('data-rm');
    if(v5){if(confirm('Delete this item?')){state.fileList=removeNode(state.fileList,v5);closeFile(v5);state.projectDirty=true;renderExplorer();renderStatusbar();}return;}
    return;
  }

  const item=e.target.closest('#tree .tree-item');
  if(item&&!e.target.closest('.tbtn')){
    const nid=item.getAttribute('data-nid');
    if(nid){
      const nd=findNode(state.fileList,nid);
      if(nd){if(nd.type==='folder')toggleFolderNode(nid);else openNode(nd);}
    }
  }
};
document.addEventListener('click',_documentTreeHandler);

function toggleAll(open){
  const maxD=open?3:999;
  const w=(n,d)=>n.forEach(x=>{
    if(x.children){
      x.isOpen=d<maxD?open:false;
      if(open)x._treeVisibleCount=Math.min(x.children.length,_TREE_PAGE_SIZE);
      w(x.children,d+1);
    }
  });
  w(state.fileList,0);
  renderExplorer();
}

/* ---------- editor view modes: code | image | audio | video | htmlcode | htmlprev ---------- */
function computeViewMode(file){
  const kind=mediaKindOf(file.name);
  if(kind==='image')return'image';
  if(kind==='audio')return'audio';
  if(kind==='video')return'video';
  const e=extOf(file.name);
  if(e==='html'||e==='htm')return state.previewMode[file.id]?'htmlprev':'htmlcode';
  return'code';
}
function disposeEditor(){if(state.editor){try{state.editor.dispose();}catch(e){}state.editor=null;}}
function renderEditor(){
  const host=$('#editor');if(!host)return;
  const file=currentOpen();
  if(!state.monacoReady){return;}
  if(!file){
    disposeEditor();
    state.viewMode='';state.viewFileId='';
    host.innerHTML='<div class="welcome" id="welcome"></div>';
    renderWelcome();return;
  }
  const mode=computeViewMode(file);
  const viewerMode=(mode==='image'||mode==='audio'||mode==='video'||mode==='htmlprev');
  /* rebuild when the mode changes, or when switching between two files in a viewer mode */
  if(mode!==state.viewMode||(viewerMode&&file.id!==state.viewFileId)){
    disposeEditor();
    state.viewMode=mode;state.viewFileId=file.id;
    host.innerHTML='';
    if(mode==='image'){renderImageViewer(host,file);return;}
    if(mode==='audio'){renderAudioViewer(host,file);return;}
    if(mode==='video'){renderVideoViewer(host,file);return;}
    if(mode==='htmlprev'){renderHtmlShell(host,file,true);return;}
    if(mode==='htmlcode'){renderHtmlShell(host,file,false);}
    else{host.innerHTML='<div id="ed-host" style="height:100%"></div>';}
  }
  state.viewFileId=file.id;
  createOrShowEditor($('#ed-host'));
}
function createOrShowEditor(mount){
  if(!mount)return;
  const file=currentOpen();if(!file)return;
  if(!state.editor){
    state.editor=monaco.editor.create(mount,{value:'',language:file.language,theme:'ban-dark',automaticLayout:true,fontFamily:MONO,fontLigatures:true,padding:{top:14,bottom:14}});
    state.editor.onDidChangeModelContent(()=>{const cur=currentOpen();if(cur)updateDocContent(cur.id,state.editor.getValue());});
    state.editor.onDidChangeCursorPosition(()=>scheduleStatusRender());
    state.editor.onDidChangeCursorSelection(()=>scheduleStatusRender());
  }
  applyEditorSettings();
  const uri=monaco.Uri.parse('inmemory://'+encodeURIComponent(file.path||file.name));
  let m=monaco.editor.getModel(uri);
  if(!m){m=monaco.editor.createModel(file.content||'',file.language,uri);}
  else {monaco.editor.setModelLanguage(m,file.language);}
  state.editor.setModel(m);
}

function renderHtmlShell(host,file,on){
  const wrap=document.createElement('div');wrap.className='preview-wrap';

    +'<span class="ptitle">'+fileIcon(file.name)+' '+esc(file.path||file.name)+'</span>'

    +'<button class="btn sm" id="pb-open">↗ Browser</button></div>'
    +(on?'<iframe id="html-frame" class="preview-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>'
        :'<div style="flex:1;min-height:0"><div id="ed-host" style="height:100%"></div></div>');

  $('#pb-prev').onclick=()=>setHtmlPreview(true);

let _pvTimer=null;
function schedulePreviewRefresh(){
  clearTimeout(_pvTimer);
  _pvTimer=setTimeout(()=>{
    const fr=$('#html-frame');const f=currentOpen();

  },400);

function openFileExternally(file){
  try{
    const c=file.content||'';
    let url;
    if(c.startsWith('data:'))url=c;
    else{
      const mime=MIME_BY_EXT[extOf(file.name)]||'text/html';
      url=URL.createObjectURL(new Blob([c],{type:mime}));
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
    window.open(url,'_blank');
  }catch(e){toast('Could not open externally','error');}
}

let _srPending=false;
function scheduleStatusRender(){if(_srPending)return;_srPending=true;requestAnimationFrame(()=>{_srPending=false;updateCursorState();renderStatusbar();});}
function updateCursorState(){

  const pos=state.editor.getPosition();const sel=state.editor.getSelection();
  let selChars=0;if(sel&&!sel.isEmpty()){try{selChars=state.editor.getModel().getValueInRange(sel).length;}catch(e){}}
  state.cursor={line:pos?pos.lineNumber:1,col:pos?pos.column:1,selChars};
}
function jumpToLine(line,q){

  if(q){try{const m=ed.getModel();const lw=m.getLineContent(line)||'';const idx=lw.toLowerCase().indexOf(String(q).toLowerCase());if(idx>=0)ed.setSelection({startLineNumber:line,endLineNumber:line,startColumn:idx+1,endColumn:idx+1+String(q).length});}catch(e){}}

/* ---------- chrome presets & extension UI theming ---------- */
const CHROME_PRESETS={
  dark:{'--bg':'#1e1e1e','--sidebar':'#252526','--activity':'#333333','--border':'#2a2a2a','--titlebar':'#252333','--accent':'#007acc','--fg':'#cccccc','--dim':'#858585','--muted':'#6b6b6b','--hover':'rgba(255,255,255,.06)','--hoverStrong':'rgba(255,255,255,.12)','--hoverBtn':'rgba(255,255,255,.16)','--card':'#2d2d2d','--cardBorder':'#3a3a3a','--inputBg':'#3c3c3c','--inputBorder':'#454545','--selectBg':'#094771','--scrollbar':'#424242','--scrollbarHover':'#4f4f4f','--termBg':'#161616','--termHead':'#2d2d2d'},
  light:{'--bg':'#ffffff','--sidebar':'#f3f3f3','--activity':'#e8e8e8','--border':'#e0e0e0','--titlebar':'#e8e8ec','--accent':'#007acc','--fg':'#1e1e1e','--dim':'#6e6e6e','--muted':'#999999','--hover':'rgba(0,0,0,.06)','--hoverStrong':'rgba(0,0,0,.10)','--hoverBtn':'rgba(0,0,0,.14)','--card':'#f6f6f6','--cardBorder':'#d8d8d8','--inputBg':'#e8e8e8','--inputBorder':'#c8c8c8','--selectBg':'#094771','--scrollbar':'#c1c1c1','--scrollbarHover':'#a8a8a8','--termBg':'#f0f0f0','--termHead':'#e0e0e0'},
  hc:{'--bg':'#000000','--sidebar':'#000000','--activity':'#000000','--border':'#6fc3df','--titlebar':'#000000','--accent':'#4fc1ff','--fg':'#ffffff','--dim':'#a9a9a9','--muted':'#888888'}
};
const UI_VAR_KEYS=['bg','sidebar','activity','border','titlebar','accent','fg','dim','muted','hover','hoverStrong','hoverBtn','card','cardBorder','inputBg','inputBorder','selectBg','scrollbar','scrollbarHover','termBg','termHead'];
function prefixVars(o){
  const out={};Object.entries(o||{}).forEach(([k,v])=>{
    const bare=String(k).replace(/^--/,'');
    if(UI_VAR_KEYS.includes(bare))out['--'+bare]=v;
  });return out;
}
/* Track inline CSS custom properties we put on :root so a theme switch can fully undo the previous one */
let _appliedVars=new Set();
function clearAppliedVars(){
  const r=document.documentElement.style;
  _appliedVars.forEach(k=>{try{r.removeProperty(k);}catch(e){}});
  _appliedVars.clear();
}
function setRootVars(map){
  const r=document.documentElement.style;
  Object.entries(map).forEach(([k,v])=>{r.setProperty(k,String(v));_appliedVars.add(k);});
}
function computeMergedUI(){
  const m={};state.extensions.forEach(x=>{const u=x.contributes&&x.contributes.ui;if(u&&typeof u==='object')Object.assign(m,u);});return m;
}
const HIDE_SELECTORS={statusbar:'#statusbar',activitybar:'#activitybar',tabs:'#tabs',titlebar:'#titlebar',sidebar:'#sidebar',terminal:'#terminal',docname:'#docname',minimap:'.monaco-editor .minimap'};
function applyUIExtensions(){
  const u=computeMergedUI();state.uiOverride=u;
  const logo=$('#brand-logo'),bn=$('#brand-name');
  if(logo)logo.textContent=u.logo||'🚫';
  if(bn)bn.textContent=u.brandName||'Ban Code';
  document.title=(u.brandName||'Ban Code')+(u.brandTag?' — '+u.brandTag:' — Extension-Powered Editor');
  const prev=$('#ext-ui-style');if(prev)prev.remove();
  const bits=[];
  if(u.radius)bits.push('.btn,.ext-card,.modal,.dropdown,.palette,.dropzone,.toast,.ctx-menu,.import-progress,.export-progress,.task-summary{border-radius:'+(+u.radius||8)+'px}');
  if(u.fontFamily)bits.push('body,button,input,select,textarea{font-family:'+String(u.fontFamily)+'}');
  if(Array.isArray(u.hide))u.hide.forEach(h=>{const sel=HIDE_SELECTORS[h];if(sel)bits.push(sel+'{display:none!important}');});
  if(u.css)bits.push(String(u.css));
  if(bits.length){const st=document.createElement('style');st.id='ext-ui-style';st.textContent=bits.join('\n');document.head.appendChild(st);}
  applyTheme(state.settings.theme);
}
function applyTheme(id){
  if(!id)return;
  if(id==='light')id='ban-light';if(id==='dark')id='ban-dark';
  const isDefault=(id==='ban-dark'||id==='ban-light'||id==='ban-hc');
  const isLight=(id==='ban-light'),isHC=(id==='ban-hc');
  const preset=isLight?CHROME_PRESETS.light:isHC?CHROME_PRESETS.hc:CHROME_PRESETS.dark;
  // 0) wipe every inline var from the previous theme so nothing leaks through
  clearAppliedVars();
  const root={};
  // 1) base chrome by luminosity (hc preset is sparse - backfill the rest from dark)
  Object.entries(preset).forEach(([k,v])=>root[k]=v);
  if(isHC)Object.entries(CHROME_PRESETS.dark).forEach(([k,v])=>{if(!(k in root))root[k]=v;});
  // 2) extension theme "chrome" overrides (page colors from a contributed theme)
  const th=_themes[id];
  if(th&&th.chrome)Object.entries(prefixVars(th.chrome)).forEach(([k,v])=>root[k]=v);
  // 3) global extension ui color overlays only apply to contributed themes,
  //    so picking a built-in theme always looks like the real built-in theme
  if(!isDefault){
    const ui=(state.uiOverride&&Object.keys(state.uiOverride).length)?state.uiOverride:computeMergedUI();
    Object.entries(prefixVars(ui)).forEach(([k,v])=>root[k]=v);
  }
  setRootVars(root);
  // Apply Monaco theme
  if(state.monacoReady){monaco.editor.setTheme(isDefault?id:(_themes[id]?id:'ban-dark'));}
  state.settings.theme=id;
}
function setupCompletion(){
  monaco.languages.registerCompletionItemProvider('*',{
    provideCompletionItems(model,position){
      const lang=model.getLanguageId();const sn=_snippets[lang]||[];
      const range={startLineNumber:position.lineNumber,startColumn:position.column,endLineNumber:position.lineNumber,endColumn:position.column};
      return {suggestions:sn.map(s=>({label:s.prefix,kind:monaco.languages.CompletionItemKind.Snippet,insertText:s.body.join('\n'),detail:s.description||s.label,documentation:{value:s.body.join('\n')},insertTextRules:monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,range}))};
    }
  });
}
function insertAtCursor(text){
  const f=currentOpen();if(!f)return toast('Open a file first','info');
  if(state.editor){
    const sel=state.editor.getSelection();
    const p=state.editor.getPosition();
    const range=(sel&&!sel.isEmpty())?sel:new monaco.Range(p.lineNumber,p.column,p.lineNumber,p.column);
    state.editor.executeEdits('extension',[{range:range,text:text}]);state.editor.focus();
  }
}

    +'<span class="sb" onclick="toggleTerminal()" title="Branch">⎇ main</span>'
    +'<span class="sb" title="Problems">✓ 0 ✗ 0</span>';
  _extStatusBarItems.filter(i=>i.alignment==='left').forEach(i=>{left+=sbExtItem(i);});
  $('#sb-left').innerHTML=left;
  let r='';
  if(f){
    r+='<span class="sb">Ln '+cur.line+', Col '+cur.col+(cur.selChars?' ('+cur.selChars+' selected)':'')+'</span>';
    if(!f.binary&&f.content&&f.content.length<100000)r+='<span class="sb" title="words · characters">'+countWords(f.content)+'w · '+f.content.length+'c</span>';
    r+='<span class="sb" onclick="ui.exec(\'cycleTab\')" title="Click to cycle indent">Spaces: '+state.settings.tabSize+'</span>'
      +'<span class="sb">UTF-8</span>'
      +'<span class="sb" style="text-transform:uppercase">'+esc(f.language)+'</span>';
    if(f.modified)r+='<span class="sb">● Unsaved</span>';
  } else r='<span class="sb">Ready</span>';
  _extStatusBarItems.filter(i=>i.alignment==='right').forEach(i=>{r+=sbExtItem(i);});
  r+='<span class="sb" onclick="toggleTerminal()" title="Toggle Terminal">⌨</span><span class="sb" id="sbver">Ban Code v3.0</span>';
  $('#sb-right').innerHTML=r;
}
function countLines(c){return c?c.split('\n').length:1;}

/* ---------- terminal ---------- */
const termState={lines:[],hist:[],hi:-1};
function termWrite(text,cls){termState.lines.push({t:text,c:cls||'term-out'});renderTerm();}
const termLine=termWrite;
const termLines=termWrite;
function renderTerm(){
  const b=$('#term-body');if(!b)return;
  b.innerHTML=termState.lines.map(l=>'<div class="term-line '+l.c+'">'+esc(l.t)+'</div>').join('')
    +'<div class="term-cmd"><span class="prompt">➜ ban ~ $</span><input id="term-in" autocomplete="off" spellcheck="false"></div>';
  const inp=$('#term-in');if(inp){inp.focus();inp.addEventListener('keydown',termKey);}
  b.scrollTop=b.scrollHeight;
}
function termKey(e){
  const inp=$('#term-in');if(!inp)return;
  if(e.key==='Enter'){const c=inp.value;inp.value='';termState.hist.push(c);termState.hi=-1;termLine(c,'term-input');runCommand(c);}
  else if(e.key==='ArrowUp'){e.preventDefault();if(termState.hist.length){termState.hi=Math.min(termState.hi+1,termState.hist.length-1);inp.value=termState.hist[termState.hist.length-1-termState.hi];}}
  else if(e.key==='ArrowDown'){e.preventDefault();termState.hi=Math.max(termState.hi-1,-1);inp.value=termState.hi<0?'':termState.hist[termState.hist.length-1-termState.hi];}
  else if(e.key==='Tab'){e.preventDefault();const cmds=termCommands();const m=cmds.find(c=>c.startsWith(inp.value.toLowerCase()));if(m)inp.value=m;}
}
function termCommands(){
  const b=['help','clear','date','echo','ls','pwd','whoami','cat','touch','mkdir','rm','open','wc','grep','history','list-ext','extensions','theme','about','exit'];
  state.extensions.forEach(x=>Object.keys(x.contributes&&x.contributes.terminalCommands||{}).forEach(c=>b.push(c)));
  return b;
}
function runCommand(raw){
  const cmd=raw.trim(),low=cmd.toLowerCase();
  if(!cmd)return;
  switch(low){
    case 'help':{
      termLines('Core commands:','term-info');
      ['  help                 this help','  clear                clear screen','  echo <text>          print text','  date                 current date/time',
       '  ls [dir]             list workspace / folder','  pwd                  working directory','  whoami               current user',
       '  cat <file>           print a file (max 400 lines)','  touch <file>         create an empty file','  mkdir <dir>          create a folder',
       '  rm <name>            delete a file/folder','  open <file>          open in editor','  wc <file>            line/word/char count',
       '  grep <pattern>       search all files','  history              recent commands','  list-ext             installed extensions',
       '  theme                list themes','  about                about Ban Code','  exit                 close terminal'].forEach(c=>termLines(c));
      const exts=[];
      state.extensions.forEach(x=>Object.entries(x.contributes&&x.contributes.terminalCommands||{}).forEach(([k,v])=>exts.push('  '+k+(v&&typeof v==='object'&&v.description?' — '+v.description:''))));
      if(exts.length){termLines('Extension commands:','term-info');exts.forEach(c=>termLines(c));}
      break;
    }
    case 'clear':termState.lines=[];renderTerm();break;
    case 'date':termLines(new Date().toString());break;
    case 'pwd':termLines('/home/'+(state.fileList[0]&&state.fileList[0].name||'workspace'));break;
    case 'whoami':termLines('developer');break;
    case 'about':termLines('🚫 Ban Code v3.0 — single-file editor with a JSON extension system','term-info');break;
    case 'history':termState.hist.slice(-25).forEach((h,i)=>termLines('  '+(i+1)+'  '+h));break;
    case 'ls':{
      const arg=cmd.split(/\s+/)[1];
      let kids=state.fileList;
      if(arg){const base=findNodeByRef(arg,'folder');if(!base){termLines('ls: folder not found: '+arg,'term-error');break;}kids=base.children||[];}
      else if(state.fileList.length)kids=state.fileList[0].children||state.fileList;
      kids.length?kids.forEach(c=>termLines((c.type==='folder'?'📁 ':'📄 ')+c.name)):termLines('(empty)');
      break;
    }
    case 'list-ext':case 'extensions':state.extensions.length?state.extensions.forEach(x=>termLines('  • '+x.name+' v'+x.version+' — '+x.publisher,'term-info')):termLines('No extensions installed.','term-info');break;
    case 'theme':termLines('Themes:','term-info');Object.keys(_themes).concat(['ban-dark','ban-light','ban-hc']).forEach(t=>termLines('  '+t));break;
    default:{
      if(low.startsWith('echo ')){termLines(cmd.slice(5));break;}
      if(low==='exit'){toggleTerminal();break;}
      if(low.startsWith('cat ')||low.startsWith('type ')){
        const nm=cmd.slice(low.startsWith('cat ')?4:5).trim();
        const n=findNodeByRef(nm,'file');
        if(!n)termLines('cat: no such file: '+nm,'term-error');
        else if(n.binary)termLines('(binary file — '+((n.mime)||'media')+')','term-info');
        else{const lines=(n.content||'').split('\n');lines.slice(0,400).forEach(l=>termLines(l));if(lines.length>400)termLines('... truncated ('+lines.length+' lines total)','term-info');}
        break;
      }
      if(low.startsWith('touch ')){const nm=cmd.slice(6).trim();if(nm){createFile(nm,'',null,null,false);renderExplorer();renderStatusbar();termLines('created '+nm);}break;}
      if(low.startsWith('mkdir ')){const nm=cmd.slice(6).trim();if(nm){createFolder(nm,null,false);renderExplorer();termLines('created folder '+nm+'/');}break;}
      if(low.startsWith('rm ')){
        const nm=cmd.slice(3).trim();const node=findNodeByRef(nm);
        if(node){state.fileList=removeNode(state.fileList,node.id);closeFile(node.id);state.projectDirty=true;renderExplorer();renderStatusbar();termLines('removed '+nm);}
        else termLines('rm: not found: '+nm,'term-error');
        break;
      }
      if(low.startsWith('open ')){const n=findNodeByRef(cmd.slice(5).trim(),'file');if(n)openNode(n);else termLines('open: file not found','term-error');break;}
      if(low.startsWith('wc ')){
        const n=findNodeByRef(cmd.slice(3).trim(),'file');
        if(!n)termLines('wc: no such file','term-error');
        else{const c=n.content||'';const L=c.split('\n').length;const W=countWords(c);termLines(L+' lines  '+W+' words  '+c.length+' chars  '+n.name);}
        break;
      }
      if(low.startsWith('grep ')){
        const pat=cmd.slice(5).trim();
        if(!pat){termLines('usage: grep <pattern>','term-info');break;}
        const res=doSearch(pat).slice(0,40);
        res.forEach(r2=>{const nd=findNode(state.fileList,r2.fileId);termLines((nd?nd.name:'?')+':'+r2.line+': '+r2.content);});
        if(!res.length)termLines('no matches','term-info');else termLines('('+res.length+' match'+(res.length>1?'es':'')+')','term-info');
        break;
      }
      let h=false;
      state.extensions.forEach(x=>{
        const map=(x.contributes&&x.contributes.terminalCommands)||{};
        const v=map[low];
        if(v!==undefined){h=true;termLines(typeof v==='object'&&v!==null?String(v.output??''):String(v));}
      });
      if(h)break;
      termLines('Command not found: '+cmd+' — type "help".','term-error');
    }
  }
}
function toggleTerminal(){
  state.terminalVisible=!state.terminalVisible;
  const term=$('#terminal');
  const resize=$('#term-resize');
  if(state.terminalVisible){
    term.classList.add('open');
    term.style.height=_termHeight+'px';
    resize.classList.add('vis');
    renderTerm();
  }else{
    _termHeight=parseInt(term.style.height)||210;
    term.style.height='0px';
    resize.classList.remove('vis');
    setTimeout(()=>{term.classList.remove('open');},220);
  }
}
$('#t-close').onclick=toggleTerminal;
$('#t-max').onclick=()=>{const h=Math.round(window.innerHeight*0.55);$('#terminal').style.height=h+'px';_termHeight=h;};
$('#t-min').onclick=()=>{$('#terminal').style.height='150px';_termHeight=150;};
(function(){let drag=null;
  $('#term-resize').addEventListener('mousedown',e=>drag={y:e.clientY,h:$('#terminal').offsetHeight||210});
  document.addEventListener('mousemove',e=>{if(drag){const h=Math.max(100,Math.min(600,drag.h+(drag.y-e.clientY)));$('#terminal').style.height=h+'px';_termHeight=h;}});
  document.addEventListener('mouseup',()=>drag=null);})();

/* ---------- activity bar ---------- */
const ACTIVITIES=[{id:'explorer',icon:'🗂',label:'Explorer'},{id:'search',icon:'🔍',label:'Search'},{id:'extensions',icon:'🧩',label:'Extensions'},{id:'settings',icon:'⚙️',label:'Settings'}];

  $('#activitybar').innerHTML=ACTIVITIES.map(a=>'<div class="ab-wrap"><button class="act '+(state.activityView===a.id?'active':'')+'" data-a="'+a.id+'">'+a.icon+'</button><span class="act-tip">'+a.label+'</span></div>').join('')
    +_extActivityButtons.map(b=>'<div class="ab-wrap"><button class="act '+(b.view&&state.activityView===b.view?'active':'')+'" data-extb="'+b.id+'">'+b.icon+'</button><span class="act-tip">'+esc(b.label||b.view||b.command)+'</span></div>').join('')
    +'<div class="spacer"></div><div class="ab-wrap"><button class="act" data-a="toggle">◧</button><span class="act-tip">Toggle Sidebar</span></div>';

function renderSidebar(){

/* ---------- search ---------- */
function doSearch(q){const out=[];const walk=n=>{n.forEach(x=>{if(x.type==='file'&&x.content&&!x.binary){try{x.content.split('\n').forEach((line,i)=>{if(line.toLowerCase().includes(q.toLowerCase()))out.push({fileId:x.id,line:i+1,content:line.trim()});});}catch(e){}}if(x.children)walk(x.children);});};walk(state.fileList);return out;}
function escRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function mark(text,q){if(!q.trim())return esc(text);return esc(text).replace(new RegExp('('+escRegex(q)+')','gi'),'<mark class="mark">$1</mark>');}
function renderSearch(body){
  body.innerHTML='<input id="srch-in" placeholder="🔍 Search" style="width:100%;background:var(--inputBg);border:none;outline:none;color:var(--fg);padding:9px 12px;border-radius:6px;margin-bottom:8px"><div class="muted" style="font-size:12px;padding:0 2px 8px;min-height:14px" id="srch-count"></div><div id="srch-res"></div>';
  const inp=$('#srch-in');inp.focus();
  const run=()=>{const q=inp.value.trim();const res=q?doSearch(q):[];$('#srch-count').textContent=q?(res.length+' results in '+new Set(res.map(r=>r.fileId)).size+' files'):'';const box=$('#srch-res');if(!q){box.innerHTML='';return;}if(!res.length){box.innerHTML='<div class="muted" style="text-align:center;padding:20px">No results</div>';return;}
    const by={};res.forEach(r=>{(by[r.fileId]=by[r.fileId]||[]).push(r);});
    box.innerHTML=Object.entries(by).map(([id,rs])=>{const node=findNode(state.fileList,id);const nm=node?node.name:'?';
      return '<div style="margin-bottom:4px"><div style="padding:3px 6px;color:var(--fg);font-size:12px">'+fileIcon(nm)+' '+esc(nm)+' <span class="pillow">'+rs.length+'</span></div>'
        +rs.map(r=>'<div class="srch-res-line" data-go="'+id+'" data-line="'+r.line+'" data-q="'+esc(q)+'"><span class="ln">:'+r.line+'</span><code>'+mark(r.content,q)+'</code></div>').join('')+'</div>';}).join('');
    $$('#srch-res [data-go]').forEach(el=>el.onclick=()=>{const n=findNode(state.fileList,el.getAttribute('data-go'));if(n)openNode(n,{line:+el.getAttribute('data-line'),query:el.getAttribute('data-q')});});
  };
  inp.addEventListener('input',run);run();
}

function themeList(){const list=[{id:'ban-dark',label:'Ban Dark'},{id:'ban-light',label:'Ban Light'},{id:'ban-hc',label:'Ban High Contrast'}];Object.keys(_themes).forEach(id=>list.push({id,label:_themes[id].label||id}));return list;}

/* ---------- advanced extension runtime ----------
   Contribution points: ui, statusBarItems, activityBarButtons, views, menus,
   languages, fileIcons, settingsDefaults, activationEvents/startupCommands,
   plus expanded command actions (javascript, multi, theme, setSetting...). */
const _extStatusBarItems=[];   // {id,text,tooltip,alignment,command}
const _extActivityButtons=[];  // {id,icon,label,view,command}
const _extViewDefs=new Map();  // id -> {title,icon,html}
const _extMenuDefs=[];         // {target,label,icon,items}

function rebuildLanguagesAndIcons(){

function activateStartupExtensions(){

/* Node lookup by path or name (any type) */
function findNodeByRef(ref,type){
  let hit=null;
  const w=arr=>arr.some(x=>{
    if((!type||x.type===type)&&(x.path===ref||x.name===ref)){hit=x;return true;}
    return x.children?w(x.children):false;
  });
  w(state.fileList);return hit;
}
/* JS sandbox API handed to "javascript" commands */
function makeBanApi(){return {

};}

function formatActiveDoc(){

/* ---------- command registry ---------- */
const _extCommands=[]; // {id,title,type,icon,action,arg}
const _extKeybinds=[]; // {combo, handler}
function installCommands(ext){const cmds=ext.contributes&&ext.contributes.commands||[];cmds.forEach(c=>_extCommands.push({id:c.id||uid(),title:c.title||c.id,type:c.action||'toast',icon:c.icon||'🧩',arg:c.arg,extension:ext.name}));}
function installKeybindings(ext){const kb=ext.contributes&&ext.contributes.keybindings||[];kb.forEach(k=>_extKeybinds.push({key:normKey(k.key),handler:()=>runExtCommandById(k.command),label:k.title||k.command}));}
function normKey(s){return (s||'').toLowerCase().replace(/[\s-]+/g,'+').replace(/control/g,'ctrl').split('+').map(x=>x.trim()).filter(Boolean).join('+');}
function runExtCommandById(id){const c=_extCommands.find(x=>x.id===id)||_extCommands.find(x=>x.title===id);if(c)runExtCommand(c);}
function runExtCommand(c){
  const A=c.arg;
  switch((c.type||'toast')){
    case 'alert':alert(A??c.title);break;
    case 'toast':case 'message':case 'notify':toast(A||c.title,c.tone||'info');break;
    case 'terminal':termLines(typeof A==='string'?A:c.title,'term-info');if(!state.terminalVisible)toggleTerminal();break;
    case 'insert':insertAtCursor(A||'');break;
    case 'open':{const n=findNode(state.fileList,c.arg)?findNode(state.fileList,c.arg):state.fileList.flatMap(g=>g.type==='folder'?(g.children||[]):[g]).find(f=>f.name===c.arg);if(n)openNode(n);else toast('File not found: '+c.arg,'error');break;}
    case 'javascript':case 'eval':{try{new Function('ban',String(A||''))(makeBanApi());}catch(err){toast('Extension script error: '+err.message,'error',5000);}break;}
    case 'setSetting':{if(A&&typeof A==='object'){Object.entries(A).forEach(([k,v])=>{state.settings[k]=v;});persistSettings();applyEditorSettings();applyTheme(state.settings.theme);renderSidebar();toast('Settings updated','success',1500);}break;}
    case 'openUrl':if(A)window.open(A,'_blank');break;
    case 'copy':navigator.clipboard.writeText(String(A??'')).then(()=>toast('Copied','success',1300)).catch(()=>{});break;
    case 'theme':if(A)applyTheme(A);break;
    case 'toggleTerminal':toggleTerminal();break;
    case 'toggleSidebar':ui.toggleSidebar();break;
    case 'zenMode':toggleZen();break;
    case 'format':formatActiveDoc();break;
    case 'newFile':{const nm=(A&&A.name)||'untitled.txt';createFile(nm,(A&&A.content)||'',null,null,false);break;}
    case 'save':ui.save();break;

function validateManifest(m){
  if(!m||typeof m!=='object'||Array.isArray(m))return 'must be a JSON object';
  if(!m.id||typeof m.id!=='string')return 'missing string "id"';
  if(!m.name||typeof m.name!=='string')return 'missing string "name"';
  const c=m.contributes||{};
  if(c.commands&&!Array.isArray(c.commands))return '"commands" must be an array';
  if(c.themes&&!Array.isArray(c.themes))return '"themes" must be an array';
  if(c.snippets&&(typeof c.snippets!=='object'))return '"snippets" must be an object';
  if(c.terminalCommands&&(typeof c.terminalCommands!=='object'))return '"terminalCommands" must be an object';
  if(c.keybindings&&!Array.isArray(c.keybindings))return '"keybindings" must be an array';
  if(c.ui&&typeof c.ui!=='object')return '"ui" must be an object';
  if(c.statusBarItems&&!Array.isArray(c.statusBarItems))return '"statusBarItems" must be an array';
  if(c.activityBarButtons&&!Array.isArray(c.activityBarButtons))return '"activityBarButtons" must be an array';
  if(c.views&&!(Array.isArray(c.views)||typeof c.views==='object'))return '"views" must be an array or object';
  if(c.menus&&!Array.isArray(c.menus))return '"menus" must be an array';
  if(c.languages&&!Array.isArray(c.languages))return '"languages" must be an array';
  if(c.fileIcons&&typeof c.fileIcons!=='object')return '"fileIcons" must be an object';
  if(c.settingsDefaults&&typeof c.settingsDefaults!=='object')return '"settingsDefaults" must be an object';
  return null;
}
function installExtension(manifest,source){
  const err=validateManifest(manifest);
  if(err)return toast('Invalid extension: '+err,'error',5200);
  if(state.extensions.find(x=>x.id===manifest.id))return toast('Extension "'+manifest.id+'" already installed. Uninstall first.','error');
  manifest.source=source;
  state.extensions.push(manifest);
  persist();
  if(state.monacoReady&&manifest.contributes&&manifest.contributes.themes)defineExtensionThemes(manifest.contributes.themes);
  rebuildExtensionRuntime();
  // one-time settings defaults from the extension
  const sd=manifest.contributes&&manifest.contributes.settingsDefaults;
  if(sd&&typeof sd==='object'){Object.assign(state.settings,sd);persistSettings();applyEditorSettings();applyTheme(state.settings.theme);}
  activateStartupExtensions();
  renderAll();
  toast('Installed "'+manifest.name+'" 🧩','success');
  openExtensionsPanel();
}

function loadProjectData(t,fname){
  if(!(t&&t.files&&Array.isArray(t.files)))return false;
  let fl=t.files;
  if(fl.length>=1&&fl[0].type==='folder'&&fl[0].name===(t.name||'project'))fl=fl[0].children||[];
  state.lazyImport=false;
  state.fileList=[{id:uid(),name:t.name||'project',type:'folder',isOpen:true,children:buildNodeTree(fl,t.name||'project'),path:t.name||'project'}];
  state.projectJson=t;state.projectDirty=false;
  renderAll();
  toast('Loaded project "'+(t.name||fname||'project')+'"','success');
  return true;
}
function installFromFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const m=JSON.parse(reader.result);
      // smart detection: a project file ({files:[...]}) loads as a project instead of erroring
      if(loadProjectData(m,file.name))return;
      installExtension(m,file.name);
    }catch(e){toast('That JSON is not valid JSON: '+e.message,'error');}
  };
  reader.readAsText(file);
}

let _dropC=0;
let _dropHasFolder=false;
document.addEventListener('dragover',e=>{e.preventDefault();_dropC++;
  // Check if any entry is a directory
  _dropHasFolder=false;
  if(e.dataTransfer&&e.dataTransfer.items){for(let i=0;i<e.dataTransfer.items.length;i++){if(e.dataTransfer.items[i].webkitGetAsEntry&&e.dataTransfer.items[i].webkitGetAsEntry().isDirectory){_dropHasFolder=true;break;}}}
  const txt=$('#dropmask-txt');
  if(txt)txt.textContent=_dropHasFolder?'⬇ Drop to import folder into project':'⬇ Drop files, folders, or .json extensions to import';
  $('#dropmask').style.display='block';
});
document.addEventListener('dragleave',e=>{_dropC--;if(_dropC<=0){_dropC=0;$('#dropmask').style.display='none';}});
document.addEventListener('drop',async e=>{e.preventDefault();_dropC=0;$('#dropmask').style.display='none';
  // Handle directory drops via webkitGetAsEntry (async tree walker)
  const items=e.dataTransfer&&e.dataTransfer.items;if(items){
    const entries=[];for(let i=0;i<items.length;i++){const entry=items[i].webkitGetAsEntry&&items[i].webkitGetAsEntry();if(entry)entries.push(entry);}
    const dirs=entries.filter(en=>en.isDirectory);
    const plainFiles=entries.filter(en=>en.isFile);
    if(dirs.length>0){
      // Import first directory as folder into project (or as new project if none open)
      if(!state.fileList.length){
        // No project open — use DataTransferItem.getFilesAndDirectories() fallback or traditional webkitRelativePath approach
        // Unfortunately getAsEntry() doesn't give us webkitRelativePath, so we need the file input approach for folder import
        toast('For folder import, use File > Import Folder or drag a folder while a project is open','info',4000);
      }else{
        // Read directory entries recursively
        const rootId=state.fileList[0].id;
        for(const dir of dirs){
          await importDirectoryEntry(dir,rootId);
        }
      }
      // Also handle any loose files dropped alongside
      if(plainFiles.length>0&&state.fileList.length){
        const filePromises=plainFiles.map(en=>new Promise(r=>en.file(f=>r(f))));
        const files=await Promise.all(filePromises);
        await importFilesIntoNode(files,rootId);
      }
    }else if(plainFiles.length>0){
      // Only loose files — check if any are .json extensions
      const filePromises=plainFiles.map(en=>new Promise(r=>en.file(f=>r(f))));
      const files=await Promise.all(filePromises);
      const jsonFiles=files.filter(f=>/\.json$/i.test(f.name)||f.type==='application/json');
      const nonJsonFiles=files.filter(f=>!(/\.json$/i.test(f.name)||f.type==='application/json'));
      // Install .json extensions
      jsonFiles.forEach(f=>installFromFile(f));
      // Import non-json files into project
      if(nonJsonFiles.length>0){
        if(!state.fileList.length){toast('Open or create a project first to import files','info');}
        else{await importFilesIntoNode(nonJsonFiles,state.fileList[0].id);}
      }
    }
    return;
  }
  // Fallback: basic file list (no entries API)
  const files=Array.from(e.dataTransfer.files||[]);
  if(!files.length)return;
  const jsonFiles=files.filter(f=>/\.json$/i.test(f.name)||f.type==='application/json');
  const nonJsonFiles=files.filter(f=>!/\.json$/i.test(f.name)&&f.type!=='application/json');
  jsonFiles.forEach(f=>installFromFile(f));
  if(nonJsonFiles.length>0){
    if(!state.fileList.length){toast('Open or create a project first to import files','info');}
    else{await importFilesIntoNode(nonJsonFiles,state.fileList[0].id);}
  }
});

/* Recursively read a FileSystemDirectoryEntry and import into a folder node */
async function importDirectoryEntry(dirEntry,parentId,_isTop){
  const prog=(_isTop!==false)?showImportProgress('Reading directory "'+dirEntry.name+'"...'):null;
  const reader=dirEntry.createReader();
  let allEntries=[];
  let batch;
  do{batch=await new Promise((res,rej)=>{reader.readEntries(res,rej);});allEntries=allEntries.concat(batch);}while(batch.length>0);
  // Create folder node directly (avoids renderExplorer call from createFolder)
  const parent=parentId?findNode(state.fileList,parentId):null;
  const pPath=parent?(parent.path||parent.name):'';
  const folderNode={id:uid(),name:dirEntry.name,type:'folder',isOpen:false,children:[],path:pPath?pPath+'/'+dirEntry.name:dirEntry.name};
  if(parent&&parent.type==='folder'){if(!parent.children)parent.children=[];parent.children.push(folderNode);}else{state.fileList.push(folderNode);}
  let processed=0,failed=0,total=allEntries.length;
  const lazyMode=total>_LAZY_THRESHOLD;
  if(lazyMode)state.lazyImport=true;
  for(const entry of allEntries){
    if(prog&&prog.isCancelled())break;
    if(entry.isDirectory){
      await importDirectoryEntry(entry,folderNode.id,false);
    }else if(entry.isFile){
      try{
        const file=await new Promise((res,rej)=>{entry.file(res,rej);});
        if(lazyMode){
          const fp=folderNode.path+'/'+entry.name;
          folderNode.children.push({id:uid(),name:entry.name,type:'file',language:langFromName(entry.name),content:'',path:fp});
          _pendingEntryRefs.set(fp,entry);
        }else{
          const rd=await readFileSmart(file,entry.name);
          folderNode.children.push({id:uid(),name:entry.name,type:'file',language:langFromName(entry.name),content:rd.content,path:folderNode.path+'/'+entry.name,binary:rd.binary||undefined,mime:rd.mime||undefined});
        }
      }catch(e){failed++;}
    }
    processed++;
    if(prog)prog.update(processed/total*100,'Processed '+processed+'/'+total+(failed?' ('+failed+' failed)':''));
    if(processed%50===0)await yieldToUI();
  }
  folderNode.children.sort((a,b)=>{if(a.type!==b.type)return a.type==='folder'?-1:1;return a.name.localeCompare(b.name);});
  if(_isTop!==false){
    state.projectDirty=true;renderExplorer();renderStatusbar();
    if(prog)prog.done();
    const added=processed-failed;
    toast('Imported "'+dirEntry.name+'" ('+added+' files'+(failed?', '+failed+' failed':'')+')'+(lazyMode?' — contents load on demand when you open files':''),'success',lazyMode?5000:3000);
  }
}

function fuzzyScore(q,s){
  q=String(q).toLowerCase();s=String(s).toLowerCase();

  for(let i=0;i<s.length&&qi<q.length;i++){

  return qi===q.length?score:-1;
}
